<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>버던_시딩</title>

<link rel="apple-touch-icon" href="https://verdan2024.github.io/verdan-core/apple-touch-icon.png">
<link rel="icon" href="https://verdan2024.github.io/verdan-core/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="버던시딩">
<meta name="theme-color" content="#30382A">

<link rel="stylesheet" href="https://verdan2024.github.io/verdan-core/verdan-core.css?v=1.1.0">
<script src="https://verdan2024.github.io/verdan-core/verdan-core.js?v=1.1.0"></script>

<style>
/* ── 이 앱에만 있는 것 ──────────────────────────────── */
/* 진행 상태 뱃지 — 색은 verdan-core 팔레트 안에서만 고른다 */
.b-발송대기{background:#F2F1EF;color:#4A4744;}
.b-업로드대기{background:#F7F1E6;color:#8A6538;}
.b-게시중{background:#EFF2EC;color:#4C6544;}
.b-미업로드{background:#F7F1E6;color:#8A6538;}
.b-종료{background:#F2F1EF;color:#6D6462;}
.b-대가없음{background:#F1EEF7;color:#5D5478;}
.b-삭제{background:#F6EBEA;color:#8E4A45;}
</style>
</head>
<body>

<div id="app">
  <div id="header"></div>

  <div id="tabs">
    <button data-page="p1" class="on">할일</button>
    <button data-page="p2">관리</button>
    <button data-page="p3">2차활용</button>
    <button data-page="p4">채팅</button>
    <button data-page="p5" data-perm="access">접근로그</button>
  </div>

  <!-- ── 할일 ───────────────────────────── -->
  <div id="p1" class="page on">
    <div class="seg" id="segToday">
      <button class="on" data-k="notice" onclick="setToday('notice')">공지</button>
      <button data-k="upchk" onclick="setToday('upchk')">업로드확인</button>
      <button data-k="post"  onclick="setToday('post')">게시확인</button>
    </div>
    <div id="v1notice" data-clear></div>
    <div id="v1upchk" data-clear style="display:none"></div>
    <div id="v1post" data-clear style="display:none"></div>
  </div>

  <!-- ── 관리 ───────────────────────────── -->
  <div id="p2" class="page">
    <div class="seg" id="segStat">
      <button class="on" data-k="dash" onclick="setStat('dash')">대시보드</button>
      <button data-k="posted"  onclick="setStat('posted')">게시확인</button>
      <button data-k="deleted" onclick="setStat('deleted')">삭제확인</button>
      <button data-k="influ"   onclick="setStat('influ')">인플루언서</button>
      <button data-k="all"     onclick="setStat('all')">전체</button>
    </div>
    <div id="v2dash" data-clear></div>
    <div id="v2posted" data-clear style="display:none"></div>
    <div id="v2deleted" data-clear style="display:none"></div>
    <div id="v2influ" style="display:none">
      <div class="card">
        <h3>인플루언서 검색</h3>
        <input class="f" type="text" id="iName" data-reset placeholder="이름 · 계정"
               oninput="VERDAN.debounce(renderInflu)">
        <div class="sub2">이름이나 계정으로 찾은 뒤 눌러 펼치면 진행 이력과 비고를 볼 수 있습니다.</div>
      </div>
      <div id="influBody" data-clear></div>
    </div>
    <div id="v2all" style="display:none">
      <div class="card">
        <h3>조건 검색</h3>
        <select id="aCat" onchange="VERDAN.debounce(renderAllList)"></select>
        <select id="aProd" onchange="VERDAN.debounce(renderAllList)"></select>
        <input class="f" type="text" id="aName" data-reset placeholder="이름 · 계정"
               oninput="VERDAN.debounce(renderAllList)">
        <button class="f ghost" onclick="resetFilter('a')">조건 초기화</button>
      </div>
      <div id="allBody" data-clear></div>
    </div>
  </div>

  <!-- ── 2차 활용 ───────────────────────── -->
  <div id="p3" class="page">
    <div class="seg" id="segSecond">
      <button class="on" data-k="dash" onclick="setSecond('dash')">대시보드</button>
      <button data-k="reg"  onclick="setSecond('reg')">등록</button>
      <button data-k="list" onclick="setSecond('list')">전체</button>
    </div>
    <div id="v3dash" data-clear></div>
    <div id="v3reg" style="display:none">
      <div class="card">
        <h3>조건 검색</h3>
        <select id="sCat" onchange="VERDAN.debounce(renderSecReg)"></select>
        <select id="sProd" onchange="VERDAN.debounce(renderSecReg)"></select>
        <input class="f" type="text" id="sName" data-reset placeholder="이름 · 계정"
               oninput="VERDAN.debounce(renderSecReg)">
        <button class="f ghost" onclick="resetFilter('s')">조건 초기화</button>
      </div>
      <div id="secRegBody" data-clear></div>
    </div>
    <div id="v3list" style="display:none">
      <div class="card">
        <h3>조건 검색</h3>
        <select id="lCat" onchange="VERDAN.debounce(renderSecList)"></select>
        <select id="lProd" onchange="VERDAN.debounce(renderSecList)"></select>
        <select id="lChan" onchange="VERDAN.debounce(renderSecList)"></select>
        <select id="lPer" onchange="VERDAN.debounce(renderSecList)"></select>
        <input class="f" type="text" id="lName" data-reset placeholder="이름 · 계정"
               oninput="VERDAN.debounce(renderSecList)">
        <button class="f ghost" onclick="resetFilter('l')">조건 초기화</button>
      </div>
      <div id="secListBody" data-clear></div>
    </div>
  </div>

  <!-- ── 채팅 ─────────────────────────────
       입력줄(#chatBar)은 코어가 채웁니다. 여기에 직접 넣지 마세요. -->
  <div id="p4" class="page chat">
    <div id="chatTop"><button class="chip gray" onclick="chatReset()">↺ 초기화</button></div>
    <div id="chatScroll"><div id="chatBody" data-clear></div></div>
    <div id="chatFoot">
      <div id="chatChips" class="chips" data-clear></div>
      <div id="chatBar"></div>
      <div class="sub2" style="margin-top:8px">
        흰색 답변은 저장된 데이터에서 바로 찾은 것입니다.<br>
        <b style="color:var(--v-ai-txt)">연두색 답변은 AI가 처리한 것으로 토큰이 소모됩니다.</b><br>
        AI로 넘기기 전에 항상 먼저 확인을 받습니다.</div>
    </div>
  </div>

  <!-- ── 접근로그 ─────────────────────────
       접속 / 기록 / 채팅 세 탭과 표는 코어가 그립니다. -->
  <div id="p5" class="page">
    <div class="seg" id="segLog"></div>
    <div id="accessBody" data-clear></div>
    <button class="f ghost" onclick="VERDAN.loadLogs(true)">새로고침</button>
  </div>

  <div class="foot">버던_시딩 · v4.1 · core <span id="coreVer"></span></div>
</div>

<script>
/* ══════════════════════════════════════════════════════
   버던_시딩 v4.1   (verdan-core 1.1.0 / 웹앱_시딩.gs v3.5)
   공통 부분은 verdan-core.js 가 처리한다.
   이 파일에는 시딩 라이프사이클 · 2차 활용 · 채팅 로직만 둔다.

   v4.0 → v4.1 에서 코어로 넘긴 것
   ① 채팅 입력줄 · 타이핑 표시 · 되묻기 칩 · 토큰 사용량 줄
      → V.chatInit / V.say / V.typing / V.confirmChips / V.tokens
      앱마다 조금씩 다르던 모양이 4개 앱에서 같아진다.
   ② 접근로그 3분류 표와 [더보기] → V.loadLogs / V.logView
      분류(kind)는 서버가 붙여 보내고, 시스템 기록은 코어가 걸러낸다.
   ③ 로그인 안내 문구(hint) → 코어 고정. 앱에서 넘기지 않는다.

   v4.0 에서 고친 것
   ① logout() 이 없는 요소('v2noupload')를 건드려 중간에 멈추던 문제.
      → 코어의 data-clear / data-reset 방식으로 바꿔 원천 차단.
   ② onclick 안에 이름을 넣을 때 작은따옴표 처리 (jsq)
   ══════════════════════════════════════════════════════ */

/* Apps Script 웹앱 배포 URL. 재배포해서 URL 이 바뀌면 이 줄만 고치면 된다. */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz3svD8sJrB-gWMNKvRzai1wnTh9YB-VQGacvpryTlKCzD56iq30BWBH0X752KsMDkw/exec";

const V = VERDAN;
const esc = V.esc, jsq = V.js, n = V.n, dayGap = V.dayGap;

let D = null;
let OPEN = {}, OPT_CACHE = '';
let V1='notice', V2='dash', V3='dash';
let PENDING_Q = '', CARDS = [], CARDN = 0;
const CARD_PAGE = 20;
/* 접근로그 상태(LOGS · 보고 있는 탭 · 불러왔는지)는 코어가 들고 있다 */

/* 플랫폼 색 — 그래프와 범례가 같은 색을 쓴다.
   verdan-core 의 데이터 컬러 5종만 쓴다. 그린 계열은 데이터에 쓰지 않는다.
   (건수가 가장 많은 브랜더진이 메인 데이터 색) */
const CAT_COLOR = {
  '브랜더진':'#B77C7C', '리뷰노트':'#C48262', '무신사':'#8A7FA8', '구글폼':'#71869B'
};
/* 화면에 보여줄 이름. 시트·통합DB의 실제 값은 '구글폼' 그대로 둔다.
   (통계 수식이 '구글폼'을 기준으로 잡혀 있어 데이터를 바꾸면 안 된다) */
const CAT_LABEL = { '구글폼':'개인협찬(구글폼)' };
const FALLBACK_COLORS = ['#6D6462','#B77C7C','#C48262','#8A7FA8','#71869B'];

VERDAN.init({
  scriptUrl : SCRIPT_URL,
  appId     : 'seeding',
  title     : '버던_시딩',
  icon      : '📮',
  iconUrl   : 'https://verdan2024.github.io/verdan-core/apple-touch-icon.png',
  appVersion: 'v4.1',
  store     : { pw:'verdan_seed_pw', user:'verdan_seed_user' },

  /* 통합DB 새로고침이 붙어 있어 넉넉히 잡는다 */
  timeout   : { read:25000, write:35000, ai:45000 },
  recheckMs : 60000,
  wmOpacity : 0.05,
  chatPage  : 'p4',

  perm: {
    admin: { label:'관리자', write:true, access:true  },
    staff: { label:'담당자', write:true, access:false }
  },
  noperm: { label:'—', write:false, access:false },

  onStart : boot,
  onData  : redraw,
  onTab   : function(p){ if(p==='p5') V.loadLogs(false); },
  onLogout: function(){
    /* 코어가 DOM 을 비우기 전에 먼저 호출되므로 값 초기화는 여기서 확실히 한다 */
    D=null; OPEN={}; OPT_CACHE='';
    V1='notice'; V2='dash'; V3='dash';
    PENDING_Q=''; CARDS=[]; CARDN=0;
  }
});

document.getElementById('coreVer').textContent = VERDAN.version;

/* 채팅 입력줄을 코어가 만들고, 보낼 때 ask() 를 부르게 연결한다 */
V.chatInit(function(q){ ask(q); });

function boot(r){
  D = r; OPT_CACHE = '';
  fillFilters(); renderAll(); chatReset();
}
function redraw(r){
  D = r; fillFilters(); renderAll();
}

/* ── 표시 이름 · 순서 · 색 ────────────── */
function catLabel(name){
  return (D && D.catLabels && D.catLabels[name]) || CAT_LABEL[name] || name;
}
/* 표시 순서 고정: 브랜더진 → 리뷰노트 → 무신사 → 개인협찬(구글폼) */
function catSort(list){
  const order = (D && D.catOrder) || ['브랜더진','리뷰노트','무신사','구글폼'];
  return list.slice().sort(function(a,b){
    const ai=order.indexOf(a), bi=order.indexOf(b);
    return (ai<0?99:ai)-(bi<0?99:bi);
  });
}
function catColor(name, i){
  return CAT_COLOR[name] || FALLBACK_COLORS[(i||0) % FALLBACK_COLORS.length];
}

/* ── 세그먼트 전환 ────────────────────── */
function segSwitch(segId, key, pairs){
  document.querySelectorAll('#'+segId+' button').forEach(function(b){
    b.className = (b.dataset.k===key) ? 'on' : '';
  });
  Object.keys(pairs).forEach(function(k){
    V.setDisp(pairs[k], (k===key) ? 'block' : 'none');
  });
}
function setToday(k){ V1=k; segSwitch('segToday',k,{notice:'v1notice',upchk:'v1upchk',post:'v1post'}); }
function setStat(k){ V2=k; segSwitch('segStat',k,
  {dash:'v2dash',posted:'v2posted',deleted:'v2deleted',influ:'v2influ',all:'v2all'}); }
function setSecond(k){ V3=k; segSwitch('segSecond',k,{dash:'v3dash',reg:'v3reg',list:'v3list'}); }

/* ── 드롭다운 ─────────────────────────── */
/* 항목은 실제 데이터에 있는 값만 넣는다. 매번 새로 만들면 느려지므로 바뀔 때만 그린다. */
function fillFilters(){
  const cats=[], prods=[];
  D.items.forEach(function(x){
    if(x.cat && cats.indexOf(x.cat)<0) cats.push(x.cat);
    if(x.product && prods.indexOf(x.product)<0) prods.push(x.product);
  });
  prods.sort();

  const sig = cats.join('|')+'##'+prods.join('|');
  if(sig===OPT_CACHE) return;
  OPT_CACHE = sig;

  const catOpt='<option value="">플랫폼 전체</option>'+
    cats.map(function(c){ return '<option value="'+esc(c)+'">'+esc(catLabel(c))+'</option>'; }).join('');
  const prodOpt='<option value="">상품 전체</option>'+
    prods.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join('');

  ['a','s','l'].forEach(function(k){
    const c=document.getElementById(k+'Cat'), p=document.getElementById(k+'Prod');
    if(!c||!p) return;
    const cv=c.value, pv=p.value;
    c.innerHTML=catOpt; p.innerHTML=prodOpt;
    c.value=cv; p.value=pv;
  });

  /* 2차활용 전체 전용 — 활용 채널 / 활용 기간 */
  const chan=document.getElementById('lChan'), per=document.getElementById('lPer');
  if(chan && per){
    const cvv=chan.value, pvv=per.value;
    chan.innerHTML='<option value="">활용 채널 전체</option>'+
      (D.secondTypes||[]).map(function(t){
        return '<option value="'+esc(t)+'">'+esc(t)+'</option>'; }).join('');
    per.innerHTML='<option value="">활용 기간 전체</option>'+
      (D.secondPeriods||[]).map(function(x){
        return '<option value="'+esc(x.t)+'">'+esc(x.t)+'</option>'; }).join('');
    chan.value=cvv; per.value=pvv;
  }
}

function resetFilter(k){
  V.setVal(k+'Cat',''); V.setVal(k+'Prod',''); V.setVal(k+'Name','');
  if(k==='l'){
    V.setVal('lChan',''); V.setVal('lPer','');
    renderSecList(); return;
  }
  if(k==='a') renderAllList(); else renderSecReg();
}

/* 이름 + 인스타 계정 둘 다 검색 대상 */
function applyFilter(k){
  const cat=document.getElementById(k+'Cat').value;
  const prod=document.getElementById(k+'Prod').value;
  const nm=document.getElementById(k+'Name').value.trim().toLowerCase().replace(/^@/,'');
  let list=D.items;
  if(cat)  list=list.filter(function(x){ return x.cat===cat; });
  if(prod) list=list.filter(function(x){ return x.product===prod; });
  if(nm)   list=list.filter(function(x){
    return (x.name+' '+x.handle).toLowerCase().replace(/@/g,'').indexOf(nm)>=0; });
  return { list:list, empty:(!cat && !prod && !nm) };
}

function renderAll(){
  renderNotice(); renderUpchk(); renderPost();
  renderDash(); renderDeleted(); renderPosted(); renderInflu(); renderAllList();
  renderSecDash(); renderSecReg(); renderSecList();
}

/* ── 이번 달 플랫폼별 표 ──────────────── */
function monthTableHtml(){
  const s=D.summary, cats=s.byCat||{};
  const keys=catSort(Object.keys(cats));
  let tot=0, up=0;
  const rows = keys.length
    ? keys.map(function(k){
        const c=cats[k]; tot+=c.total; up+=c.uploaded;
        const no=c.total-c.uploaded;
        return '<tr><td><b>'+esc(catLabel(k))+'</b></td>'+
          '<td class="ctr">'+n(c.total)+'</td>'+
          '<td class="ctr ok">'+n(c.uploaded)+'</td>'+
          '<td class="ctr '+(no>0?'danger':'')+'">'+n(no)+'</td></tr>';
      }).join('')
    : '<tr><td colspan="4" class="ctr sub2">이번 달 시딩 내역이 없습니다.</td></tr>';
  const foot = keys.length
    ? '<tr style="background:#F2F1EC"><td><b>합계</b></td>'+
      '<td class="ctr"><b>'+n(tot)+'</b></td>'+
      '<td class="ctr ok"><b>'+n(up)+'</b></td>'+
      '<td class="ctr '+((tot-up)>0?'danger':'')+'"><b>'+n(tot-up)+'</b></td></tr>'
    : '';
  return '<div class="chart"><h3>'+esc(s.ym.replace('-','.'))+' 기준</h3>'+
    '<div class="tbl-wrap" style="margin-bottom:0"><table><thead><tr>'+
    '<th style="text-align:left">플랫폼</th><th>협찬</th><th>업로드</th><th>미업로드</th>'+
    '</tr></thead><tbody>'+rows+foot+'</tbody></table></div></div>';
}

/* ── 할일 · 공지 ──────────────────────── */
function renderNotice(){
  const s=D.summary;
  const hl=function(v){ return v>0 ? '<span class="hl">'+n(v)+'건</span>' : n(v)+'건'; };
  V.setHTML('v1notice',
    '<div class="notice"><div class="ttl">'+esc(s.ym.replace('-','.'))+' 기준</div>'+
    '시딩 <b>'+n(s.total)+'건</b> · 업로드완료 <b>'+n(s.uploaded)+'</b> · 대기 <b>'+n(s.waiting)+'</b><br>'+
    (s.rental ? '<span class="sub2">└ 발송 '+n(s.seeding)+'건 · 대여 '+n(s.rental)+'건</span><br>' : '')+
    '원고료 <b>'+n(s.fee)+'원</b><br>'+
    '현재 게시중 <b>'+n(s.posting)+'건</b><br>'+
    '게시기간 만료임박 '+hl(s.postEnd)+'<br>'+
    '2차활용 종료임박 '+hl(s.secondEnd)+'<br>'+
    '업로드마감 초과 '+hl(s.overdue)+'</div>'+
    '<div class="notice"><div class="ttl">오늘 처리할 것</div>'+
    '업로드확인 '+hl(s.needUpload)+'<br>'+
    '게시확인 '+hl(s.needPost)+'<br>'+
    '게시기간 중 삭제확인 '+hl(D.items.filter(function(x){
       return x.state==='삭제' && x.postPeriod && x.delchk && x.delchk<=x.postPeriod;
     }).length)+'</div>'+
    monthTableHtml()+
    '<button class="f ghost" onclick="VERDAN.reload(true)">새로고침</button>');
}

/* ── 할일 · 업로드확인 ──────────────────
   마감일 당일부터 등장. [완료]를 눌러야 사라지고, [미완료]는 하루만 넘긴다. */
function renderUpchk(){
  const list=D.items.filter(function(x){ return x.flags.indexOf('needUpload')>=0; })
    .slice().sort(function(a,b){ return (a.dDeadline||0)-(b.dDeadline||0); });

/* ── 그래프 조각 ──────────────────────── */
function recentMonths(cnt){
  const out=[], d=new Date();
  for(let i=cnt-1;i>=0;i--){
    const t=new Date(d.getFullYear(), d.getMonth()-i, 1);
    out.push(t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0'));
  }
  return out;
}
/* 세로 누적 막대 — 시간 흐름을 왼쪽에서 오른쪽으로 읽게 한다 */
function stackedBars(months, cats, matrix){
  let max=1;
  months.forEach(function(m,i){
    let sum=0; cats.forEach(function(c){ sum+=matrix[c][i]||0; });
    if(sum>max) max=sum;
  });
  const cols=months.map(function(m,i){
    let sum=0; cats.forEach(function(c){ sum+=matrix[c][i]||0; });
    const segs=cats.map(function(c,ci){
      const v=matrix[c][i]||0;
      if(!v) return '';
      const h=v/max*118;
      /* 칸이 너무 얇으면 숫자가 뭉개지므로 13px 이상일 때만 안에 넣는다 */
      const label = h>=13 ? '<span>'+v+'</span>' : '';
      return '<div class="seg" style="height:'+h+'px;background:'+catColor(c,ci)+'">'+label+'</div>';
    }).join('');
    return '<div class="vcol">'+
      '<div class="tot">'+(sum||'')+'</div>'+
      '<div class="stack">'+segs+'</div>'+
      '<div class="lb">'+esc(m.slice(2).replace('-','.'))+'</div></div>';
  }).join('');
  const legend=cats.map(function(c,ci){
    return '<span><i style="background:'+catColor(c,ci)+'"></i>'+esc(catLabel(c))+'</span>'; }).join('');
  return '<div class="vbars">'+cols+'</div><div class="legend">'+legend+'</div>';
}
/* 가로 막대 — 항목 이름이 길어 읽기 편하다 */
function hBars(pairs){
  let max=1;
  pairs.forEach(function(p){ if(p.v>max) max=p.v; });
  const total=pairs.reduce(function(s,p){ return s+p.v; },0)||1;
  return pairs.map(function(p,i){
    return '<div class="hbar"><div class="top"><span>'+esc(catLabel(p.k))+'</span>'+
      '<b>'+n(p.v)+'건 · '+Math.round(p.v/total*100)+'%</b></div>'+
      '<div class="track"><div class="fill" style="width:'+(p.v/max*100)+'%;background:'+
      catColor(p.k,i)+'"></div></div></div>';
  }).join('');
}
/* 도넛 — 비중을 한눈에 */
function donut(pairs, centerLabel){
  const total=pairs.reduce(function(s,p){ return s+p.v; },0);
  if(!total) return '<div class="sub2">표시할 데이터가 없습니다.</div>';
  let acc=0;
  const stops=pairs.map(function(p,i){
    const from=acc/total*360; acc+=p.v;
    return catColor(p.k,i)+' '+from+'deg '+(acc/total*360)+'deg';
  }).join(',');
  const side=pairs.map(function(p,i){
    return '<div><i style="background:'+catColor(p.k,i)+'"></i>'+esc(catLabel(p.k))+
      '<b>'+n(p.v)+'건</b></div>'; }).join('');
  return '<div class="donut"><div class="ring" style="background:conic-gradient('+stops+')">'+
    '<div class="hole"><b>'+n(total)+'</b><span>'+esc(centerLabel||'건')+'</span></div></div>'+
    '<div class="side">'+side+'</div></div>';
}

    '</div>';

  /* 브랜더진 수수료 — 과거 방식(판매 목적 라이센스)에는 붙지 않는다 */
  const feeHtml =
    '<div class="money"><div class="row"><span>브랜더진 수수료 '+rate+'%</span></div>'+
    '<div class="money big" style="margin-bottom:10px">'+n(feeTotal)+'원</div>'+
    '<div class="hr"></div>'+
    years.map(function(y){
      return '<div class="row"><span>'+esc(y)+'년</span><b>'+n(feeYear[y]||0)+'원</b></div>'; }).join('')+
    '<div class="hr"></div>'+
    '<div class="row"><span><b>총 지출 (비용 + 수수료)</b></span>'+
      '<b>'+n(grand+feeTotal)+'원</b></div>'+
    '<div class="sub2" style="margin-top:6px">'+
      '과거 방식인 "판매 목적 라이센스" 건에는 수수료가 붙지 않습니다.</div></div>';

  V.setHTML('v3dash',

      '<span class="money big">'+n(list.length)+'건</span>'+
      '<div class="sub2" style="margin-top:4px">비용 '+n(grand)+'원'+
      (feeTotal?' + 수수료 '+n(feeTotal)+'원':'')+'</div></div>'+

function renderDeleted(){

    .slice().sort(function(a,b){ return String(b.delchk).localeCompare(String(a.delchk)); });

  const during=all.filter(function(x){
    return x.postPeriod && x.delchk && x.delchk <= x.postPeriod; });

      h+='<div class="box-danger"><b style="color:var(--v-danger)">🔴 게시기간 중 삭제 '+during.length+'건</b> · '+
         '재업로드를 요청하세요.</div>'+

function renderPosted(){
  const days=(D.thresholds && D.thresholds.postCheck) || 7;

        '누르면 오늘 날짜가 최종확인에 기록됩니다.</div>'+

      (V.can('write')
        ? '<textarea class="f memo" id="mm_'+esc(uid)+'" rows="3" '+
            'placeholder="조건 불이행, DM 미응답 등 다음 시딩에 참고할 내용">'+esc(memo.memo)+'</textarea>'+
          '<button class="f" onclick="doMemo(\''+jsq(p.key)+'\',\''+jsq(uid)+'\',\''+jsq(p.name)+'\')">비고 저장</button>'+
          '<div class="msg" id="m_'+esc(uid)+'"></div>'
        : '<div class="sub2">'+esc(memo.memo||'—')+'</div>')+
    '</div></div>';
}

function doMemo(key, uid, name){
  const el=document.getElementById('mm_'+uid);
  act({ action:'memo', key:key, name:name, memo:(el?el.value:'') }, uid,
      '비고를 저장했습니다.', 'memo:'+key);
}

/* ── 관리 · 전체 ──────────────────────── */
function renderAllList(){
  const r=applyFilter('a');
  if(r.empty){
    V.setHTML('allBody','<div class="box-note">플랫폼·상품을 고르거나 이름·계정을 입력하면 결과가 나옵니다.</div>');
    return;
  }
  V.setHTML('allBody', listHtml(r.list,'all'));
}

/* ── 2차활용 · 등록 ───────────────────── */
function renderSecReg(){
  const r=applyFilter('s');
  if(r.empty){
    V.setHTML('secRegBody','<div class="box-note">플랫폼·상품을 고르거나 이름·계정을 입력해 대상을 찾아주세요.</div>');
    return;
  }
  V.setHTML('secRegBody', listHtml(r.list,'sec'));
}

/* ── 2차활용 · 전체 ─────────────────────
   앱에서 등록한 건 + 시트에 예전 방식으로 표시된 건(브랜더진 W열)을 함께 본다. */
function renderSecList(){
  let list=D.items.filter(function(x){ return x.s2type || x.legacy2; });

  const cat=document.getElementById('lCat').value;
  const prod=document.getElementById('lProd').value;
  const chan=document.getElementById('lChan').value;
  const per=document.getElementById('lPer').value;
  const nm=document.getElementById('lName').value.trim().toLowerCase().replace(/^@/,'');

  if(cat)  list=list.filter(function(x){ return x.cat===cat; });
  if(prod) list=list.filter(function(x){ return x.product===prod; });
  if(chan) list=list.filter(function(x){ return x.s2type===chan; });
  if(per)  list=list.filter(function(x){ return (x.s2period||(x.s2forever?'영구':''))===per; });
  if(nm)   list=list.filter(function(x){
    return (x.name+' '+(x.handleShown||x.handle||'')).toLowerCase()
      .replace(/@/g,'').indexOf(nm)>=0; });

  list=list.slice().sort(function(a,b){
    const av=a.s2type?0:1, bv=b.s2type?0:1;
    if(av!==bv) return av-bv;
    if(a.s2forever&&b.s2forever) return 0;
    if(a.s2forever) return 1;
    if(b.s2forever) return -1;
    return String(a.s2e).localeCompare(String(b.s2e));
  });

  if(!list.length){
    V.setHTML('secListBody','<div class="box-note">조건에 맞는 2차 활용 건이 없습니다.</div>');
    return;
  }

  const legacy=list.filter(function(x){ return !x.s2type; });
  const soon=list.filter(function(x){ return x.flags.indexOf('secondEnd')>=0; }).length;

  V.setHTML('secListBody',
    (soon ? '<div class="box-danger"><b style="color:var(--v-danger)">🟣 종료 임박 '+soon+'건</b><br>'+
      '만료 전에 연장 협의 또는 소재 내리기를 확인하세요.</div>' : '')+
    (legacy.length ? '<div class="box-note">⚠️ 금액만 있고 <b>기간이 등록되지 않은 '+
      legacy.length+'건</b>이 있습니다.<br>'+
      '항목을 눌러 [2차 활용 등록]에서 채널·기간을 채워주세요.</div>' : '')+
    list.map(function(x){ return itemHtml(x,'seclist'); }).join(''));
}

/* ── 공통 목록 ────────────────────────── */
function listHtml(list, ctx){
  if(!list.length) return '<div class="box-note">조건에 맞는 건이 없습니다.</div>';
  return '<div class="sub2" style="margin-bottom:8px">'+list.length+'건</div>'+
    list.slice(0,300).map(function(x){ return itemHtml(x,ctx); }).join('')+
    (list.length>300 ? '<div class="box-note">300건까지만 표시했습니다. 검색으로 좁혀주세요.</div>' : '');
}

/* 게시중이면 D-N, 끝났으면 종료, 그 외에는 상태 글자 그대로 */
function tagText(x){
  if(x.state==='게시중') return (x.dPost===null) ? '게시중' : ('D-'+x.dPost);
  return x.state;
}

/* ── 항목 카드 ────────────────────────── */
function itemHtml(x, ctx){
  const uid = ctx+'_'+String(x.id).replace(/[^A-Za-z0-9가-힣_-]/g,'_');
  const open = OPEN[uid] ? ' open' : '';
  let note='';
  if(!x.uploadDate && x.dDeadline!==null && x.state!=='대가없음'){
    note = x.dDeadline<0 ? '<div class="dd over">마감 '+(-x.dDeadline)+'일 초과</div>'
         : '<div class="dd soon">마감까지 '+x.dDeadline+'일</div>';
  }else if(x.state==='삭제' && x.delchk){
    note = '<div class="dd over">'+esc(x.delchk)+' 확인</div>';
  }
  /* 관리·게시확인에서 확인 주기가 지난 건을 눈에 띄게 */
  if(ctx==='pchk'){
    const days=(D.thresholds && D.thresholds.postCheck) || 7;
    const over = !x.check || dayGap(x.check, D.today) >= days;
    note = (over ? '<div class="dd over">🔴 확인 필요</div>' : '')+
      '<div class="dd ok">최종확인 '+esc(x.check||'없음')+'</div>';
  }

  return '<div class="it'+open+'" id="'+esc(uid)+'">'+
    '<div class="hd" onclick="toggleIt(\''+jsq(uid)+'\')">'+
      '<div><div class="nm">'+esc(x.name)+'</div>'+
        '<div class="meta">'+esc(catLabel(x.cat))+(x.campaign?' · '+esc(x.campaign):'')+'<br>'+
        esc(x.product||'—')+'</div></div>'+
      '<div class="right"><span class="badge b-'+esc(x.state)+'">'+esc(tagText(x))+'</span>'+
        (x.isRental ? '<div class="dd rent">대여</div>' : '')+note+'</div>'+
    '</div>'+
    quickHtml(x, uid, ctx)+
    '<div class="bd">'+detailHtml(x, uid, ctx)+'</div></div>';
}

function toggleIt(uid){
  const el=document.getElementById(uid);
  if(!el) return;
  const now = el.className.indexOf('open')===-1;
  el.className = now ? 'it open' : 'it';
  OPEN[uid]=now;
}

/* ── 카드에 바로 붙는 버튼 ──────────────
   펼치지 않고 한 번에 처리할 수 있게 하기 위한 것.
   onclick 안에 들어가는 값은 전부 jsq 로 감싼다 — 이름이나 URL 에
   작은따옴표가 들어가면 버튼이 통째로 죽기 때문이다. */
function openBtn(url, label){
  if(!url) return '';
  return '<button onclick="event.stopPropagation();window.open(\''+jsq(url)+'\',\'_blank\')">'+
    esc(label)+'</button>';
}
function quickHtml(x, uid, ctx){
  if(!V.can('write')) return '';
  const acct = openBtn(x.acctUrl, '계정');
  const anyUrl = openBtn(x.url || x.acctUrl, 'URL');
  const id = jsq(x.id), u = jsq(uid);
  let b='';

  if(ctx==='upc'){
    b = acct +
      '<button class="pri" onclick="event.stopPropagation();doUpload(\''+id+'\',\''+u+'\')">완료</button>'+
      '<button class="no" onclick="event.stopPropagation();doUpchk(\''+id+'\',\''+u+'\')">미완료</button>';
  }else if(ctx==='pst'){
    b = (x.url ? openBtn(x.url,'글 열기') : acct) +
      '<button class="pri" onclick="event.stopPropagation();doCheck(\''+id+'\',\''+u+'\')">확인</button>'+
      '<button class="no" onclick="event.stopPropagation();doDel(\''+id+'\',\''+u+'\')">미확인</button>';
  }else if(ctx==='nou'){
    /* 계정을 열어 올라왔는지 확인한 뒤 둘 중 하나를 누른다.
       어느 쪽이든 최종확인에 오늘 날짜가 기록된다. */
    b = (anyUrl || acct) +
      '<button class="no" onclick="event.stopPropagation();doRecheck(\''+id+'\',\''+u+'\')">미업로드</button>'+
      '<button class="pri" onclick="event.stopPropagation();doUpload(\''+id+'\',\''+u+'\')">업로드</button>';
  }else if(ctx==='pchk'){
    b = (anyUrl || acct) +
      '<button class="no" onclick="event.stopPropagation();doDel(\''+id+'\',\''+u+'\')">삭제</button>'+
      '<button class="pri" onclick="event.stopPropagation();doCheck(\''+id+'\',\''+u+'\')">게시중</button>';
  }else if(ctx==='del'){
    /* 게시기간 중 삭제 — 미처리는 확인만, 처리완료는 업로드완료로 복구 */
    b = (anyUrl || acct) +
      '<button class="no" onclick="event.stopPropagation();doRecheck(\''+id+'\',\''+u+'\')">미처리</button>'+
      '<button class="pri" onclick="event.stopPropagation();doRestore(\''+id+'\',\''+u+'\')">처리완료</button>';
  }else{
    return '';   /* delok · all · sec 등은 조치할 것이 없어 버튼을 두지 않는다 */
  }

  return '<div class="qa">'+b+'</div><div class="qmsg" id="q_'+esc(uid)+'"></div>';
}

function detailHtml(x, uid, ctx){
  /* 게시기간 — 업로드 전이면 "—", 업로드했으면 "업로드일 ~ 종료일" */
  const period = x.uploadDate ? esc(x.uploadDate)+' ~ '+esc(x.postPeriod||'—') : '—';

  const acct = x.acctUrl
    ? '<a href="'+esc(x.acctUrl)+'" target="_blank" rel="noopener">'+
        esc(x.handleShown||x.handle||'열기')+'</a>'
    : esc(x.handleShown||x.handle||'—');

  const second = has
    ? 'O <span class="more" onclick="VERDAN.toggleBox(\'s2_'+jsq(uid)+'\')">상세보기</span>'
    : 'X';

      : '<span>계정</span><b>'+acct+'</b>')+
    '<span>캠페인 · 업로드마감</span><b>'+esc(x.campaign||'—')+' · '+esc(x.deadline||'—')+'</b>'+
    '<span>게시기간</span><b>'+period+'</b>'+
    (x.way && x.way!=='시딩' ? '<span>진행방식</span><b>'+esc(x.way)+'</b>' : '')+
    (x.coop ? '<span>협업유형</span><b>'+esc(x.coop)+'</b>' : '')+
    '<span>2차 활용</span><b>'+second+'</b>'+
    (x.url ? '<span>콘텐츠</span><b><a href="'+esc(x.url)+
      '" target="_blank" rel="noopener">링크 열기</a></b>' : '')+
    '<span>최종확인</span><b>'+esc(x.check||'미확인')+'</b>'+
    '</div>';

  if(has){
    h+='<div class="box2" id="s2_'+esc(uid)+'" style="display:none">'+
       '<div class="kv" style="padding-top:0">'+
         '<span>사용권 구매일</span><b>'+esc(x.s2s||'—')+'</b>'+
         '<span>활용 기간</span><b>'+esc(x.s2period|| (x.s2forever?'영구':'—'))+'</b>'+
         '<span>활용 마감일</span><b>'+(x.s2forever?'영구':esc(x.s2e||'—'))+'</b>'+
         '<span>활용 채널</span><b>'+esc(x.s2type||'미등록')+'</b>'+
         '<span>2차활용 비용</span><b>'+(x.amount?n(x.amount)+'원':'—')+
           (x.brandFee?' <span class="sub2">(+수수료 '+n(x.brandFee)+'원)</span>':'')+'</b>'+
         '<span>비고</span><b>'+esc(x.s2memo||'—')+'</b>'+
       '</div></div>';
  }

  if(!V.can('write')) return h;

  /* 할일 탭에서는 콘텐츠 URL을 나중에 채울 수 있게 남겨둔다.

  if(ctx==='upc' || ctx==='pst' || ctx==='nou' || ctx==='pchk'){
    return h+'<div class="hr"></div><div class="acts">'+

      '<button class="f ghost" onclick="doUrl(\''+jsq(x.id)+'\',\''+jsq(uid)+'\')">URL 저장</button>'+
      '<div class="msg" id="m_'+esc(uid)+'"></div></div>';
  }

  if(ctx==='sec' || ctx==='seclist'){
    h+='<div class="hr"></div><div class="acts">'+
       '<button class="f ghost" onclick="VERDAN.toggleBox(\'ed_'+jsq(uid)+'\')">'+
         (has?'2차 활용 수정':'2차 활용 등록')+'</button>'+
       '<div id="ed_'+esc(uid)+'" style="display:none">'+secondFormHtml(x, uid)+'</div>'+
       '<div class="msg" id="m_'+esc(uid)+'"></div></div>';

  return h;

function secondFormHtml(x, uid){
  const types=(D.secondTypes||[]).map(function(t){
    return '<option value="'+esc(t)+'"'+(x.s2type===t?' selected':'')+'>'+esc(t)+'</option>'; }).join('');
  const periods=(D.secondPeriods||[]).map(function(p){
    return '<option value="'+esc(p.v)+'"'+(x.s2period===p.t?' selected':'')+'>'+esc(p.t)+'</option>'; }).join('');
  const cost = x.s2cost ? x.s2cost : (x.amount||'');

  /* 날짜칸과 선택칸을 한 줄에 둘씩 넣으면 모바일에서 겹쳐 보이므로
     각 항목을 한 줄씩 배치하고, 입력칸 높이를 .fld 로 통일한다. */
  return '<div class="lb2">사용권 구매일 (계약일)</div>'+
    '<input class="f fld" type="date" id="ss_'+esc(uid)+'" value="'+esc(x.s2s||D.today)+'">'+
    '<div class="lb2">활용 기간</div>'+
    '<select class="fld" id="sp_'+esc(uid)+'"><option value="">선택</option>'+periods+'</select>'+
    '<div class="lb2">활용 채널</div>'+
    '<select class="fld" id="st_'+esc(uid)+'"><option value="">선택</option>'+types+'</select>'+
    '<div class="lb2">2차활용 비용</div>'+
    '<input class="f fld" type="number" id="sc_'+esc(uid)+'" placeholder="0" inputmode="numeric" '+
      'value="'+esc(cost)+'">'+
    '<div class="lb2">비고</div>'+
    '<input class="f fld" type="text" id="sm_'+esc(uid)+'" placeholder="메모 (선택)" '+
      'value="'+esc(x.s2memo||'')+'">'+
    '<button class="f" onclick="doSecond(\''+jsq(x.id)+'\',\''+jsq(uid)+'\')">2차 활용 등록</button>'+
    (x.s2type ? '<button class="f ghost" onclick="doSecondClear(\''+jsq(x.id)+'\',\''+
      jsq(uid)+'\')">등록 해제</button>' : '')+
    '<div class="sub2">구매일 + 선택한 기간으로 <b>활용 마감일이 자동 계산</b>됩니다.<br>'+
    (x.feeExempt
      ? '이 건은 과거 방식이라 수수료가 붙지 않습니다.'
      : '브랜더진은 비용에 수수료 '+Math.round((D.brandFeeRate||0.145)*1000)/10+
        '%가 별도로 붙습니다.')+

}

/* 메시지는 펼친 폼과 카드 버튼 양쪽에 같이 쓴다 */
function im(uid, t, err){
  ['m_','q_'].forEach(function(pre){
    const el=document.getElementById(pre+uid);
    if(el){ el.textContent=t; el.className=(pre==='m_'?'msg':'qmsg')+(err?' err':' good'); }
  });
}

/* ── 쓰기 동작 ──────────────────────────
   idem 을 주면 같은 작업을 다시 눌러도 서버가 중복을 걸러낼 수 있다. */
async function act(params, uid, okMsg, idem){
  if(V.isBusy()) return;
  V.busy(true); im(uid,'저장 중...',false);
  try{
    const r=await V.api(params, { mode:'write', idem: idem || (params.action+':'+(params.id||'')) });
    if(!r.ok){ im(uid, r.msg||'저장에 실패했습니다.', true); return; }
    im(uid, okMsg, false);
    V.setData(r);        /* D 갱신 + 화면 다시 그리기 */
  }catch(e){
    /* 시간 초과는 서버에 들어갔는지 알 수 없다. 중복 저장을 막기 위해 확인부터 안내한다. */
    im(uid, V.failMsg(e, '새로고침으로 반영 여부를 먼저 확인하세요.'), true);
  }finally{ V.busy(false); }
}

function doUpload(id, uid){ act({ action:'upload', id:id }, uid, '오늘 날짜로 업로드 처리했습니다.', 'upload:'+id); }
function doUrl(id, uid){
  const el=document.getElementById('cu_'+uid);
  const url=((el&&el.value)||'').trim();
  if(!url){ im(uid,'콘텐츠 URL을 입력하세요.',true); return; }
  act({ action:'url', id:id, url:url }, uid, 'URL을 저장했습니다.', 'url:'+id);
}
function doUpchk(id, uid){ act({ action:'upchk', id:id }, uid, '미완료로 기록했습니다. 내일 다시 뜹니다.', 'upchk:'+id); }
function doCheck(id, uid){ act({ action:'check', id:id }, uid, '게시확인 완료. 7일 뒤 다시 뜹니다.', 'check:'+id); }
function doDel(id, uid){
  if(!confirm('게시글이 내려간 건으로 표시할까요?\n삭제확인 탭으로 옮기고, 시트의 업로드 여부가 "삭제"로 바뀝니다.')) return;
  act({ action:'del', id:id }, uid, '삭제확인으로 옮겼습니다.', 'del:'+id);
}
function doRecheck(id, uid){ act({ action:'recheck', id:id }, uid, '미처리로 확인만 기록했습니다.', 'recheck:'+id); }
function doRestore(id, uid){ act({ action:'del', id:id, restore:'1' }, uid, '처리완료 — 업로드완료로 복구했습니다.', 'restore:'+id); }
function doSecond(id, uid){
  const g=function(p){ const e=document.getElementById(p+'_'+uid); return e?e.value:''; };
  const type=g('st'), months=g('sp'), start=g('ss'), cost=g('sc'), memo=g('sm');
  if(!type){ im(uid,'활용 채널을 선택하세요.',true); return; }
  if(months===''){ im(uid,'활용 기간을 선택하세요.',true); return; }
  if(!start){ im(uid,'사용권 구매일을 입력하세요.',true); return; }
  act({ action:'second', id:id, type:type, months:months, start:start, cost:cost, memo:memo },
      uid, '2차 활용을 등록했습니다.', 'second:'+id+':'+start+':'+months);
}
function doSecondClear(id, uid){
  if(!confirm('이 건의 2차 활용 등록을 해제할까요?')) return;
  act({ action:'second', id:id, clear:'1' }, uid, '2차 활용 등록을 해제했습니다.', 'secclear:'+id);
}

/* ── 채팅 ───────────────────────────────
   말풍선 색으로 답의 출처를 구분한다.
     흰색   = 저장된 데이터에서 규칙으로 찾은 답 (토큰 0)
     연두색 = AI 가 만든 답 (토큰 소모 · 답변 아래에 사용량이 붙는다)
   입력줄 · 타이핑 점 · 되묻기 칩 · 토큰 줄은 코어가 그린다.
   서버는 사용자별 직전 1턴을 30분간 기억하고 있다가 AI 호출 때 함께 넘긴다. */
const CHAT_SAMPLES = [
  '오브 스웨이드백 크림 2차 활용 남은 사람 있어?',
  '브랜더진 김민경 2차활용 조건 알려줘',
  '리뷰노트 2025-09에 업로드된 콘텐츠 알려줘',
  '브랜더진에서 진행한 오브백 블랙 콘텐츠 전부 알려줘'
];

function chatReset(){
  V.chatClear();
  CARDS=[]; CARDN=0; PENDING_Q='';

  /* 화면만 지우면 서버는 직전 대화를 30분간 계속 들고 있다.
     초기화는 "앞의 이야기를 잊자"는 뜻이므로 서버 기억도 함께 버린다. */
  if(V.loggedIn()){
    V.api({ action:'chat', reset:'1' }).catch(function(){});
  }

  V.say('bot','플랫폼 · 이름(또는 @계정) · 상품 · 연월을 넣어 물어보면 바로 답합니다.');
  V.chips(CHAT_SAMPLES.map(function(t){
    return { label:t, on:function(){ V.chatAsk(t); } };
  }));
}

async function ask(q, confirmed){
  if(V.isBusy()) return;
  const text = confirmed ? PENDING_Q : String(q||'').trim();
  if(!text) return;
  if(!confirmed) V.say('me', text);
  V.chips([]);

  V.chatBusy(true);
  const wait = V.typing();

  try{
    const params={ action:'chat', q:text };
    if(confirmed) params.confirm='1';
    const r=await V.api(params, { mode:'ai' });
    wait.remove();

    if(!r.ok){ V.say('bot', r.msg||'답하지 못했습니다.'); return; }

    /* 규칙으로 못 푼 경우 — 바로 AI로 넘기지 않고 먼저 되묻는다.
       비용은 사용자가 동의한 뒤에만 발생해야 한다. */
    if(r.source==='confirm'){
      PENDING_Q=text;
      V.say('bot', r.reply);
      V.confirmChips(function(){ ask('', true); }, chatNo);
      return;
    }

    /* 목록형 답변은 20건씩 나눠 보여준다 */
    if(r.cards && r.cards.length){
      CARDS=r.cards; CARDN=0;
      V.say('bot', r.head || (r.cards.length+'건입니다.'));
      showCards();
      return;
    }

    const d=V.say(r.source==='llm' ? 'ai' : 'bot', r.reply);
    if(r.source==='llm') V.tokens(d, r.usage);

  }catch(e){
    wait.remove();
    V.say('bot', V.failMsg(e,'잠시 후 다시 물어봐 주세요.'));
  }finally{
    V.chatBusy(false);
  }
}

function showCards(){
  const chunk=CARDS.slice(CARDN, CARDN+CARD_PAGE);
  if(!chunk.length) return;
  V.say('bot', chunk.join('\n\n'));
  CARDN+=chunk.length;
  if(CARDN<CARDS.length){
    V.chips([{ label:'더보기 ('+CARDN+' / '+CARDS.length+')', on:showCards }]);
  }else{
    V.chips([]);
  }
}

function chatNo(){
  PENDING_Q='';
  V.say('bot','다시 질문해주세요.\n플랫폼 · 이름(또는 @계정) · 상품 · 연월을 넣으면 더 정확합니다.');
}

/* ── 접근로그 ───────────────────────────
   접속 / 기록 / 채팅 세 탭과 표는 코어가 그린다.
     접속 = 로그인 성공·실패
     기록 = 사람이 앱에서 값을 바꾼 작업 (자동 트리거 기록은 서버가 걸러낸다)
     채팅 = 질문·답변. [더보기]로 펼치면 질문과 답변이 나뉘어 보이고,
            AI가 만든 답변에는 AI 배지가 붙는다.
   이 앱에서 따로 할 일은 없다. 새로고침 버튼이 V.loadLogs(true) 를 부른다. */

</script>
