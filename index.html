    '<div class="lb2">활용 기간</div>'+
    '<select class="fld" id="sp_'+esc(uid)+'"><option value="">선택</option>'+periods+'</select>'+
    '<div class="lb2">활용 채널</div>'+
    '<select class="fld" id="st_'+esc(uid)+'"><option value="">선택</option>'+types+'</select>'+
    '<div class="lb2">2차활용 비용</div>'+
    '<input class="f fld" type="number" id="sc_'+esc(uid)+'" placeholder="0" inputmode="numeric" '+
      'value="'+esc(cost)+'">'+
    '<div class="lb2">비고</div>'+
    '<input class="f fld" type="text" id="sm_'+esc(uid)+'" placeholder="메모 (선택)" '+
      'value="'+esc(x.s2memo||'')+'">'+
    '<button class="f" style="margin-top:14px" onclick="doSecond(\''+jsq(x.id)+'\',\''+jsq(uid)+'\')">2차 활용 등록</button>'+
    (x.s2type ? '<button class="f ghost" onclick="doSecondClear(\''+jsq(x.id)+'\',\''+
      jsq(uid)+'\')">등록 해제</button>' : '')+
    '<div class="sub2">구매일 + 선택한 기간으로 <b>활용 마감일이 자동 계산</b>됩니다.<br>'+
    (x.feeExempt
      ? '이 건은 과거 방식이라 수수료가 붙지 않습니다.'
      : '브랜더진은 비용에 수수료 '+Math.round((D.brandFeeRate||0.145)*1000)/10+
        '%가 별도로 붙습니다.')+
    '</div>';
}

/* 메시지는 펼친 폼과 카드 버튼 양쪽에 같이 쓴다 */
function im(uid, t, err){
  ['m_','q_'].forEach(function(pre){
    const el=$(pre+uid);
    if(el){ el.textContent=t; el.className=(pre==='m_'?'msg':'qmsg')+(err?' err':' good'); }
  });
}

/* ── 쓰기 동작 ──────────────────────────────────────
   idem 을 주면 같은 작업을 다시 눌러도 서버가 중복을 걸러낼 수 있다. */
async function act(params, uid, okMsg, idem){
  if(BUSY) return;
  BUSY = true; im(uid,'저장 중...',false);
  try{
    const r=await api(params, { mode:'write', idem: idem || (params.action+':'+(params.id||'')) });
    if(!r || !r.ok){ im(uid, (r&&r.msg)||'저장에 실패했습니다.', true); return; }
    im(uid, okMsg, false);
    setData(r);        /* D 갱신 + 화면 다시 그리기 */
  }catch(e){
    /* 시간 초과는 서버에 들어갔는지 알 수 없다. 중복 저장을 막기 위해 확인부터 안내한다. */
    im(uid, failMsg(e, '새로고침으로 반영 여부를 먼저 확인하세요.'), true);
  }finally{ BUSY = false; }
}

function doUpload(id, uid){ act({ action:'upload', id:id }, uid, '오늘 날짜로 업로드 처리했습니다.', 'upload:'+id); }
function doUrl(id, uid){
  const el=$('cu_'+uid);
  const url=((el&&el.value)||'').trim();
  if(!url){ im(uid,'콘텐츠 URL을 입력하세요.',true); return; }
  act({ action:'url', id:id, url:url }, uid, 'URL을 저장했습니다.', 'url:'+id);
}
function doUpchk(id, uid){ act({ action:'upchk', id:id }, uid, '미완료로 기록했습니다. 내일 다시 뜹니다.', 'upchk:'+id); }
function doCheck(id, uid){ act({ action:'check', id:id }, uid, '게시확인 완료. 7일 뒤 다시 뜹니다.', 'check:'+id); }
function doDel(id, uid){
  askConfirm('게시글이 내려간 건으로 표시할까요?\n삭제확인으로 옮기고 시트의 업로드 여부가 "삭제"로 바뀝니다.',
    function(){ act({ action:'del', id:id }, uid, '삭제확인으로 옮겼습니다.', 'del:'+id); });
}
function doRecheck(id, uid){ act({ action:'recheck', id:id }, uid, '미처리로 확인만 기록했습니다.', 'recheck:'+id); }
function doRestore(id, uid){ act({ action:'del', id:id, restore:'1' }, uid, '처리완료 — 업로드완료로 복구했습니다.', 'restore:'+id); }
function doSecond(id, uid){
  const g=function(p){ const e=$(p+'_'+uid); return e?e.value:''; };
  const type=g('st'), months=g('sp'), start=g('ss'), cost=g('sc'), memo=g('sm');
  if(!type){ im(uid,'활용 채널을 선택하세요.',true); return; }
  if(months===''){ im(uid,'활용 기간을 선택하세요.',true); return; }
  if(!start){ im(uid,'사용권 구매일을 입력하세요.',true); return; }
  act({ action:'second', id:id, type:type, months:months, start:start, cost:cost, memo:memo },
      uid, '2차 활용을 등록했습니다.', 'second:'+id+':'+start+':'+months);
}
function doSecondClear(id, uid){
  askConfirm('이 건의 2차 활용 등록을 해제할까요?', function(){
    act({ action:'second', id:id, clear:'1' }, uid, '2차 활용 등록을 해제했습니다.', 'secclear:'+id);
  });
}

/* ══════════════════════════════════════════════════
   채팅 — 하단 내비에서 여는 전체 화면
   --------------------------------------------------
   말풍선 색으로 답의 출처를 구분한다.
     흰색   = 저장된 데이터에서 규칙으로 찾은 답 (토큰 0)
     연두색 = AI 가 만든 답 (AI 배지 + 아래에 토큰 사용량)
   서버는 사용자별 직전 1턴을 30분간 기억하고 있다가 AI 호출 때 함께 넘긴다.
   ══════════════════════════════════════════════════ */
function openChat(on){
  const w=$('chatWrap');
  if(on){
    CHAT_ON = true;
    w.classList.add('on');
    canvas(); applyViewportHeight();
    NAV='chat'; paintBottom();
    setTimeout(chatScrollEnd, 30);
  }else{
    if(!CHAT_ON) return;
    CHAT_ON = false;
    const ta=$('qInput'); if(ta) ta.blur();
    w.classList.remove('on');
    canvas(); applyViewportHeight();
    if(NAV==='chat'){ NAV = (PAGE==='p9') ? 'my' : 'home'; paintBottom(); }
  }
}

function buildChat(){
  /* placeholder 는 넣지 않습니다. 예시 문구는 첫 말풍선이 대신합니다. */
  setHTML('chatBar',
    '<textarea id="qInput" rows="1" data-reset autocomplete="off"></textarea>'+
    '<button class="send" id="askBtn" aria-label="보내기">'+ic('up')+'</button>');

  const ta=$('qInput'), btn=$('askBtn');
  /* 글이 길어지면 입력칸만 늘어납니다(최대 4줄). 버튼 크기는 그대로입니다. */
  function grow(){
    ta.style.height='auto';
    ta.style.height=Math.min(ta.scrollHeight, 96)+'px';
  }
  ta.addEventListener('input', grow);
  /* 키보드 애니메이션이 끝나는 시점이 기기마다 다릅니다. 두 번 나눠 맞춥니다. */
  ta.addEventListener('focus', function(){
    setTimeout(function(){ applyViewportHeight(); chatScrollEnd(); }, 300);
    setTimeout(function(){ applyViewportHeight(); chatScrollEnd(); }, 650);
  });
  /* 넓은 화면에서만 Enter 로 보냅니다.
     모바일에서 Enter 가 전송이면 줄바꿈을 할 수 없습니다. */
  ta.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey && window.innerWidth>700){ e.preventDefault(); chatSend(); }
  });
  btn.addEventListener('click', chatSend);
}

function chatSend(){
  const ta=$('qInput');
  if(!ta) return;
  const q=(ta.value||'').trim();
  if(!q) return;
  ta.value=''; ta.style.height='auto';
  ask(q);
}
function chatScrollEnd(){
  const sc=$('chatScroll');
  if(sc) sc.scrollTop=sc.scrollHeight;
}
function chatBusy(on){
  const ta=$('qInput'), btn=$('askBtn');
  if(btn) btn.disabled=!!on;
  if(ta) ta.disabled=!!on;
  BUSY=!!on;
}

/* who : 'me' | 'bot' | 'ai' */
function say(who, text){
  const b=$('chatBody');
  if(!b) return null;
  const d=document.createElement('div');
  d.className='cmsg '+who;
  d.innerHTML=(who==='ai' ? '<div class="aib">AI</div>' : '')+linkify(text);
  b.appendChild(d);
  chatScrollEnd();
  return d;
}
/* 답변을 생각하는 동안 점 세 개가 움직입니다. 지울 때 el.remove() */
function typing(){
  const b=$('chatBody');
  if(!b) return { remove:function(){} };
  const d=document.createElement('div');
  d.className='cmsg bot';
  d.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';
  b.appendChild(d);
  chatScrollEnd();
  return d;
}
/* AI 답변 아래에 토큰 사용량을 붙입니다 */
function tokens(el, usage){
  if(!el || !usage) return;
  const u=document.createElement('div');
  u.className='tok';
  u.textContent='토큰 '+n(usage.total)+'개 사용 (입력 '+n(usage.input)+' · 출력 '+n(usage.output)+')';
  el.appendChild(u);
  chatScrollEnd();
}
/* 칩 목록 — [{ label:'…', on:함수, gray:true }] */
function chips(list){
  const box=$('chatChips');
  if(!box) return;
  box.innerHTML='';
  (list||[]).forEach(function(c){
    const b=document.createElement('button');
    b.className='chip'+(c.gray?' gray':'');
    b.textContent=c.label;
    b.onclick=c.on;
    box.appendChild(b);
  });
  chatScrollEnd();
}
/* 규칙으로 못 푼 질문 — 되묻기 */
function confirmChips(onYes, onNo){
  chips([
    { label:'네, 물어봐 주세요', on:function(){ chips([]); if(onYes) onYes(); } },
    { label:'아니오', gray:true, on:function(){ chips([]); if(onNo) onNo(); } }
  ]);
}

function chatReset(){
  setHTML('chatBody',''); setHTML('chatChips','');
  setVal('qInput','');
  const ta=$('qInput'); if(ta) ta.style.height='auto';
  CARDS=[]; CARDN=0; PENDING_Q='';

  /* 화면만 지우면 서버는 직전 대화를 30분간 계속 들고 있다.
     초기화는 "앞의 이야기를 잊자"는 뜻이므로 서버 기억도 함께 버린다. */
  if(PW){
    api({ action:'chat', reset:'1' }).catch(function(){});
  }

  say('bot','플랫폼 · 이름(또는 @계정) · 상품 · 연월을 넣어서 질문해 주세요.\n\n'+
    '예) 브랜더진 김민경 2차활용 조건 알려줘');
}

async function ask(q, confirmed){
  if(BUSY) return;
  const text = confirmed ? PENDING_Q : String(q||'').trim();
  if(!text) return;
  if(!confirmed) say('me', text);
  chips([]);

  chatBusy(true);
  const wait = typing();

  try{
    const params={ action:'chat', q:text };
    if(confirmed) params.confirm='1';
    const r=await api(params, { mode:'ai' });
    wait.remove();

    if(!r || !r.ok){ say('bot', (r&&r.msg)||'답하지 못했습니다.'); return; }

    /* 규칙으로 못 푼 경우 — 바로 AI로 넘기지 않고 먼저 되묻는다.
       비용은 사용자가 동의한 뒤에만 발생해야 한다. */
    if(r.source==='confirm'){
      PENDING_Q=text;
      say('bot', r.reply);
      confirmChips(function(){ ask('', true); }, chatNo);
      return;
    }

    /* 목록형 답변은 20건씩 나눠 보여준다 */
    if(r.cards && r.cards.length){
      CARDS=r.cards; CARDN=0;
      say('bot', r.head || (r.cards.length+'건입니다.'));
      showCards();
      return;
    }

    const d=say(r.source==='llm' ? 'ai' : 'bot', r.reply);
    if(r.source==='llm') tokens(d, r.usage);

  }catch(e){
    wait.remove();
    say('bot', failMsg(e,'잠시 후 다시 물어봐 주세요.'));
  }finally{
    chatBusy(false);
  }
}

function showCards(){
  const chunk=CARDS.slice(CARDN, CARDN+CARD_PAGE);
  if(!chunk.length) return;
  say('bot', chunk.join('\n\n'));
  CARDN+=chunk.length;
  if(CARDN<CARDS.length){
    chips([{ label:'더보기 ('+CARDN+' / '+CARDS.length+')', on:showCards }]);
  }else{
    chips([]);
  }
}

function chatNo(){
  PENDING_Q='';
  say('bot','다시 질문해주세요.\n플랫폼 · 이름(또는 @계정) · 상품 · 연월을 넣으면 더 정확합니다.');
}

/* ── 이벤트 묶기 ──────────────────────────────────── */
function segBind(id, fn){
  const box=$(id); if(!box) return;
  box.addEventListener('click', function(e){
    const b = e.target.closest('button');
    if(!b) return;
    this.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    fn(b.dataset.k || b.dataset.v);
  });
}

function bindAll(){
  document.querySelectorAll('.page').forEach(function(p){
    p.addEventListener('scroll', onScroll, {passive:true});
  });
  $('tabs').addEventListener('click', function(e){
    const b = e.target.closest('button[data-page]');
    if(b){ NAV='home'; go(b.dataset.page); paintBottom(); }
  });
  $('bottom').addEventListener('click', function(e){
    const b = e.target.closest('button[data-k]');
    if(!b) return;
    if(b.dataset.k==='chat'){ openChat(true); return; }
    openChat(false);
    NAV = b.dataset.k;
    go(NAV==='my' ? 'p9' : LASTMAIN);
    paintBottom();
  });
  $('brandBtn').addEventListener('click', function(){
    openCat(!$('catWrap').classList.contains('on'));
  });
  $('scrim').addEventListener('click', function(){ openCat(false); });
  $('catClose').addEventListener('click', function(){ openCat(false); });

  /* 새로고침 — 지금 보고 있는 화면에 맞게 동작합니다 */
  $('rfBtn').addEventListener('click', function(){
    if($('stampRow').classList.contains('busy')) return;
    if(PAGE==='p9' && can('access')){
      $('stampRow').classList.add('busy');
      loadLogs(true).finally(function(){ $('stampRow').classList.remove('busy'); });
    }else{
      reload(true);
    }
  });

  segBind('segStat',   setStat);
  segBind('segSecond', setSecond);
  segBind('segLog', function(k){ LOGVIEW=k; renderLogs(); });
  segBind('segTheme', function(v){
    applyTheme(v);
    store(STORE.theme, v);
  });
  document.querySelectorAll('#segTheme button').forEach(function(b){
    b.classList.toggle('on', b.dataset.v===THEME);
  });

  /* 조건 검색 — 글자를 칠 때마다 그리지 않고 잠시 모읍니다 */
  ['iCat','iProd'].forEach(function(id){
    $(id).addEventListener('change', function(){ deb(renderInflu); }); });
  $('iName').addEventListener('input', function(){ deb(renderInflu); });
  $('iGo').addEventListener('click', renderInflu);
  $('iReset').addEventListener('click', function(){ resetFilter('i'); });

  ['cCat','cProd','cFrom','cTo'].forEach(function(id){
    $(id).addEventListener('change', function(){ deb(renderCamp); }); });
  $('cGo').addEventListener('click', renderCamp);
  $('cReset').addEventListener('click', function(){ resetFilter('c'); });

  ['sCat','sProd'].forEach(function(id){
    $(id).addEventListener('change', function(){ deb(renderSecReg); }); });
  $('sName').addEventListener('input', function(){ deb(renderSecReg); });
  $('sGo').addEventListener('click', renderSecReg);
  $('sReset').addEventListener('click', function(){ resetFilter('s'); });

  ['lCat','lProd','lChan','lPer'].forEach(function(id){
    $(id).addEventListener('change', function(){ deb(renderSecList); }); });
  $('lName').addEventListener('input', function(){ deb(renderSecList); });
  $('lGo').addEventListener('click', renderSecList);
  $('lReset').addEventListener('click', function(){ resetFilter('l'); });

  /* 로그인 */
  $('loginBtn').addEventListener('click', login);
  $('nm').addEventListener('keydown', function(e){ if(e.key==='Enter') $('pw').focus(); });
  $('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') login(); });

  /* 채팅 */
  $('chatCloseBtn').addEventListener('click', function(){ openChat(false); });
  $('chatResetBtn').addEventListener('click', function(){
    askConfirm('채팅 내용을 지우고 처음부터 다시 시작할까요?', chatReset);
  });

  $('outBtn').addEventListener('click', function(){
    askConfirm('로그아웃할까요?', logout);
  });
  $('dlgYes').addEventListener('click', function(){ closeDlg(true); });
  $('dlgNo').addEventListener('click', function(){ closeDlg(false); });
  $('dlg').addEventListener('click', function(e){ if(e.target===this) closeDlg(false); });
}

/* ── 시작 ─────────────────────────────────────────
   ⚠️ 이 블록은 반드시 스크립트 맨 끝에 있어야 합니다.
      const 로 선언한 값(NAVS · LINKS 등)은 끌어올려지지 않아서,
      위쪽에서 부르면 "Cannot access before initialization" 으로
      파일이 통째로 죽습니다. 문법 검사로는 잡히지 않습니다. */
(function init(){
  try{
    buildIcons(); buildCat(); buildBottom(); buildChat(); bindAll();

    const saved = store(STORE.pw);
    const savedUser = store(STORE.user) || '';
    setVal('nm', savedUser);

    if(saved){
      PW = saved; USER = savedUser || '(미입력)';
      autoLogin();
    }else{
      showGate();
    }
  }catch(e){
    /* 무슨 일이 있어도 로그인 화면은 떠야 합니다.
       빈 화면은 사용자가 손쓸 방법이 없습니다. */
    showGate();
    gmsg('화면을 여는 중 문제가 생겼습니다. ' + (e && e.message ? e.message : ''));
  }
})();

/* 마지막 안전장치 — 3초가 지나도 아무 화면도 없으면 로그인 화면을 띄웁니다 */
setTimeout(function(){
  if(!$('gate').classList.contains('on') && !$('app').classList.contains('on')) showGate();
}, 3000);
</script>
