<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<!-- 확대·축소를 막습니다. 손가락으로 당겨 화면이 한 번 줄어들면
     안전영역(상태바) 계산이 통째로 어긋나 헤더가 시계와 겹칩니다.
     ⚠️ 예전에 이 값이 독립 앱 모드에서 입력칸 포커스를 막은 적이 있습니다.
        로그인 칸이 눌리지 않으면 아래 줄로 되돌리세요.
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
     입력칸 글자는 16px 이라 자동 확대는 일어나지 않습니다. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>시딩관리</title>

<link rel="apple-touch-icon" href="https://verdan2024.github.io/verdan-core/apple-touch-icon.png">
<link rel="icon" href="https://verdan2024.github.io/verdan-core/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="시딩관리">
<meta name="theme-color" content="#30382A">

<style>
/* ══════════════════════════════════════════════════════
   시딩관리 v5.0   (웹앱_시딩.gs v3.5)

   ⚠️ 이 버전은 verdan-core 를 쓰지 않고 단독으로 동작합니다.
      재고관리 v6.8 에서 실기기로 검증한 새 UI 구조(스플래시 · 접히는 헤더 ·
      하단 내비 · 마이페이지 · 라이트/다크)를 시딩 데이터로 이어서 검증하기
      위해서입니다. 검증이 끝나면 공통부를 verdan-core 1.2.0 으로 옮기고
      이 파일은 다시 코어를 참조하는 형태로 되돌립니다.

   v4.1 → v5.0
   ① 스플래시 1초 → 로그인 (자동 로그인이면 바로 본 화면)
   ② 헤더 = 로고+화살표 / 앱이름 · 새로고침 / ↻ 갱신시각 (스크롤하면 접힘)
   ③ 상단 탭에서 [채팅] [접근로그] 제거 → 할일 | 관리 | 2차활용
      채팅은 하단 내비에서 여는 전체 화면, 접근로그는 마이페이지 안
   ④ 각 화면 맨 아래 [새로고침] 5곳 삭제 → 헤더 하나로
   ⑤ 하위 세그먼트를 밑줄(.seg-nav) 방식으로
   ⑥ 이모지를 단색 SVG 아이콘 · 상태 점으로 교체
      뱃지 7종 · 구획 머리의 하드코딩 색을 상태 토큰 조합으로 교체
   ⑦ 라이트/다크 색 토큰 두 벌
   ⑧ confirm() → 브랜드 색 확인창(askConfirm)
   ⑨ 관리 · 2차활용의 긴 목록을 접이식으로
      (조치가 필요한 알림은 접힘 밖에 그대로 둡니다)

   v5.0 → v5.1  (실기기 확인 반영 · 프로모션 v3.4 와 같은 규칙)
   ① 접근로그 — 결과를 아랫줄로 내리고, 채팅은 [상세보기]로 펼칩니다
   ② 삭제확인 [게시기간 중 삭제]도 접이식으로. 두 묶음 다 닫힌 채로 시작합니다
   ③ "재업로드를 요청하세요" 안내를 접이식 안으로 옮겼습니다
   ④ 로그인 덩어리를 조금 더 아래로. 칸을 누르는 순간 먼저 밀어 올립니다
   ⑤ 채팅 상단을 밝은 색으로. 제목 '버던' → '채팅', 아바타에 아이콘
   ⑥ 화면 맨 아래 각주 전부 삭제
   ⑦ 갱신 시각에 날짜가 함께 보입니다 (앞 5글자 자르기 → 형식 판별)
   ⑧ 카테고리 판을 absolute 로 — 키보드가 올라와도 기준 상자가 흔들리지 않게

   v5.1 → v5.2  (실기기 확인 반영)
   ① 2차활용 금액 · 수수료를 한 판 안에서 [금액][수수료]로 나눠 봅니다
   ② 링크가 걸린 글자는 전부 'URL' 로 통일 · 밑줄
   ③ 삭제확인 붉은 상자 삭제 (접이식 제목에 이미 건수가 있습니다)
   ④ 할일·공지를 [이번 달 기준][오늘 처리할 것] 두 접이식으로.
      줄글을 표로 바꿔 숫자가 눈에 들어오게. 둘 다 펼친 채로 시작합니다
   ⑤ 인플루언서 콘텐츠를 '1. URL' 로 줄였습니다
   ⑥ 비고 칸 한 줄 · 버튼 [저장]
   ⑦⑧ 검색 안내 문구 삭제 · [초기화][검색] 두 버튼으로
   ⑨ 2차활용 그래프 두 개도 접이식으로

   v5.2 → v5.3
   ① 할일 세그먼트(공지·업로드확인·게시확인) 삭제 → 한 화면에 접이식으로.
      건수가 0이면 그 묶음은 아예 그리지 않습니다.
   ② 공지 숫자를 성격별 카드 박스로 나눔 (처리 · 진행 · 금액 · 확인 필요 · 플랫폼별)
   ③ 관리 [전체] → [캠페인]. 기간 · 플랫폼 · 상품으로 캠페인을 찾습니다
   ④ 인플루언서 검색이 [전체] 자리를 이어받아 플랫폼 · 상품 · 이름 전부 검색.
      결과 카드 안에서 비고를 바로 고칠 수 있습니다
   ⑤ 두 대시보드의 [전체 누적] 숫자 위치를 맞춤

   서버 규격은 v4.1 과 같습니다. 바뀐 것은 화면뿐입니다.
   ══════════════════════════════════════════════════════ */

/* ── 색 토큰 · 라이트 ───────────────────────────────
   ⚠️ 색 코드를 직접 쓰지 마세요. 여기 값만 참조합니다. */
:root{
  /* 예전 --v-ink 이 헤더 · 주버튼 · 강조글자를 겸했는데,
     다크에서 셋이 서로 다른 방향으로 가야 해서 쪼갰습니다. */
  --v-header:#30382A;        /* 헤더 — 라이트/다크 동일 (같은 브랜드로 보이게) */
  --v-cta:#30382A;           /* 주버튼 배경 */
  --v-cta-txt:#FFFFFF;       /* 주버튼 글자 */
  --v-strong:#30382A;        /* 강조 글자 */

  --v-accent:#829568;
  --v-accent2:#B2C58E;
  --v-bg:#F7F6F1;
  --v-card:#FFFFFF;
  --v-soft:#FAFAF7;
  --v-thead:#F2F1EC;
  --v-seg:#EDEDE7;
  --v-line:#E5E6DF;
  --v-txt:#252721;
  --v-mute:#696C64;
  --v-ph:#A9AAA3;
  --v-onink:#FFFFFF;
  --v-link:#71869B;
  --v-stale:#F0C9C6;
  --v-wm:#252721;
  --v-track:#E5E6DF;

  --v-ok:#64815A;      --v-ok-bg:#EFF2EC;      --v-ok-line:#CFDAC6;
  --v-warn:#B1844E;    --v-warn-bg:#F7F1E6;    --v-warn-line:#E3D2B4;
  --v-danger:#B45F59;  --v-danger-bg:#F6EBEA;  --v-danger-line:#E4C6C4;

  /* AI 말풍선 — 토큰이 소모된 답변임을 색으로 구분합니다 */
  --v-ai-bg:#F1F4EA;   --v-ai-line:#B2C58E;    --v-ai-txt:#30382A;

  /* 뱃지 전용 — 상태 3종으로 표현할 수 없는 두 가지만 따로 둡니다.
     라벤더 = 대가없음(비용이 오가지 않은 건) · 회색 = 대기 · 종료 */
  --v-lav-bg:#F1EEF7;  --v-lav-tx:#5D5478;
  --v-gray-bg:#F2F1EF; --v-gray-tx:#5A5B54;

  --v-d1:#B77C7C; --v-d2:#C48262; --v-d3:#8A7FA8; --v-d4:#71869B; --v-d5:#6D6462;

  --v-radius:14px;
  --wm-op:.05;
  --hh:64px;              /* 헤더 높이 — JS 가 실측해 넣습니다 */
  --ease:cubic-bezier(.22,.61,.36,1);
}

/* ── 색 토큰 · 다크 ─────────────────────────────────
   색을 뒤집는 게 아니라 밝기로 층을 나눕니다.
   bg < card < soft < seg 순서로 밝아집니다. */
[data-theme="dark"]{
  --v-header:#30382A;
  --v-cta:#B2C58E;           /* 어두운 배경에서 Deep Olive 는 묻힙니다 */
  --v-cta-txt:#23261F;
  --v-strong:#E8EAE3;

  --v-accent:#9FB283;
  --v-accent2:#B2C58E;
  --v-bg:#191B15;
  --v-card:#23261F;
  --v-soft:#2B2E26;
  --v-thead:#2B2E26;
  --v-seg:#32362C;
  --v-line:#383B31;
  --v-txt:#E8EAE3;
  --v-mute:#9AA093;
  --v-ph:#6E7468;
  --v-onink:#FFFFFF;
  --v-link:#9FB4C8;
  --v-stale:#E4A5A0;
  --v-wm:#E8EAE3;
  --v-track:#32362C;

  --v-ok:#8FAE83;      --v-ok-bg:#232A20;      --v-ok-line:#3A4834;
  --v-warn:#D6A96A;    --v-warn-bg:#2E271B;    --v-warn-line:#4A3E28;
  --v-danger:#D98A84;  --v-danger-bg:#2E211F;  --v-danger-line:#4C3230;

  --v-ai-bg:#262E20;   --v-ai-line:#6E8455;    --v-ai-txt:#D9E4C6;

  --v-lav-bg:#2A2733;  --v-lav-tx:#A196BE;
  --v-gray-bg:#2B2E26; --v-gray-tx:#9AA093;

  --v-d1:#C99191; --v-d2:#D89A78; --v-d3:#A196BE; --v-d4:#8AA0B6; --v-d5:#8C8380;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

/* ── 화면 뼈대 ──────────────────────────────────────
   바깥(문서)은 스크롤되지 않게 잠그고 안쪽 판(.page)만 스크롤합니다.
   문서 전체가 스크롤되면 iOS 에서 고무줄 반동이 생기고 주소창이
   오르내리며 화면 높이가 계속 바뀌어 헤더·탭이 흔들립니다. */
/* 문서 바탕(canvas) — 화면 맨 아래에 앱 바깥 영역이 남는 기기가 있습니다.
   그 자리는 body 가 아무리 늘어나도 닿지 않고 이 색이 보입니다.
   색은 JS(canvas)가 화면에 맞춰 직접 넣습니다. */
html{height:100%;overflow:hidden;background:#30382A;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',-apple-system,Arial,sans-serif;
  /* ⚠️ 여기에 앱 배경색을 두면 안 됩니다.
     iOS 독립 앱은 화면 아래 '앱 바깥' 자리를 body 배경색으로 칠합니다.
     그 색은 JS(canvas)가 화면에 맞춰 넣고, 앱 배경은 #app·#gate 가 갖습니다. */
  background:#30382A;color:var(--v-txt);
  /* ⚠️ 높이를 계산해서 넣지 않습니다. 네 변을 0 으로 붙이면 계산 자체가 없어집니다.
     키보드가 올라올 때만 JS 가 높이를 잠깐 대신 잡습니다. */
  position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;
  display:flex;flex-direction:column;overscroll-behavior:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;
  transition:background-color .25s var(--ease),color .25s var(--ease);}

/* ⚠️ height 에는 절대 transition 을 걸지 마세요.
   iOS 는 키보드가 올라오는 동안 크기 변화를 여러 번 알려줍니다.
   그때마다 전환이 처음부터 다시 시작되면서 계단처럼 툭툭 끊깁니다. */

/* ── 스플래시 ────────────────────────────────────── */
#splash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#30382A;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .45s var(--ease);}
#splash.gone{opacity:0;pointer-events:none;}
#splash .logo{width:200px;height:auto;display:block;}

/* ── 로그인 ─────────────────────────────────────── */
#gate{background:var(--v-bg);flex:1;min-height:0;overflow-y:auto;overscroll-behavior:none;display:none;
  flex-direction:column;
  padding:calc(24px + env(safe-area-inset-top)) 26px calc(24px + env(safe-area-inset-bottom));}
#gate.on{display:flex;}
/* 위아래 여백을 1.4 : 1 로 나눠 정중앙보다 조금 아래에 놓습니다.
   ⚠️ padding 이나 margin 으로 내리면 키보드가 올라왔을 때 내용이 위로 잘려 나갑니다. */
#gate::before{content:'';flex:1.9 1 0;min-height:0;}
#gate::after {content:'';flex:1 1 0;min-height:0;}
/* 키보드가 올라올 때 이 덩어리만 위로 미끄러집니다.
   움직이는 것이 transform 하나뿐이라 레이아웃 계산이 없습니다.
   ⚠️ 여기에 transition 을 걸지 마세요.
      iOS 키보드가 올라오는 길이와 곡선은 웹으로 전달되지 않습니다.
      비슷하게 흉내 내면 어긋난 움직임이 둘이 되어 하나일 때보다 어색합니다. */
#gateIn{flex-shrink:0;}
#gate .logo{width:140px;height:auto;display:block;margin-bottom:14px;}
#gate .sub{font-size:13px;color:var(--v-mute);margin-bottom:26px;margin-left:3px;}
#gate input{width:100%;padding:15px 16px;border:1px solid var(--v-line);border-radius:12px;
  font-size:16px;margin-bottom:9px;font-family:inherit;background:var(--v-soft);color:var(--v-txt);
  -webkit-user-select:text;user-select:text;touch-action:manipulation;}
#gate input::placeholder{color:var(--v-ph);}
#gate input:focus{outline:none;border-color:var(--v-accent);background:var(--v-card);}
#gate button{width:100%;padding:15px;border:none;border-radius:12px;background:var(--v-cta);
  color:var(--v-cta-txt);font-size:15px;font-weight:700;font-family:inherit;margin-top:5px;}
#gate button:disabled{opacity:.55;}
#gateMsg{font-size:13px;color:var(--v-danger);margin-top:12px;min-height:18px;line-height:1.6;
  text-align:center;}
#gateMsg.wait{color:var(--v-mute);}
#gate .hint{font-size:11px;color:var(--v-mute);margin-top:12px;line-height:1.7;text-align:center;}

/* ── 앱 뼈대 ────────────────────────────────────── */
#app{background:var(--v-bg);display:none;flex-direction:column;flex:1;min-height:0;overflow:hidden;}
#app.on{display:flex;}

/* 헤더 + 탭을 한 덩어리로 묶습니다.
   접히면 margin-top 을 헤더 높이만큼 음수로 줘서 헤더가 위로 잘려 나갑니다.
   안전영역(상태바) 여백은 #chrome 이 갖습니다. */
#chrome{flex-shrink:0;z-index:30;background:var(--v-header);
  padding-top:calc(env(safe-area-inset-top) + 6px);}
/* ⚠️ overflow:hidden 은 패딩 상자 기준으로 자릅니다.
   안전영역 패딩을 #chrome 이 갖고 자르기는 이 안쪽 상자가 맡아야
   헤더가 상태바(시계·배터리) 영역으로 올라오지 않습니다. */
#headWrap{overflow:hidden;}
#header{padding:6px 18px 12px;display:flex;align-items:flex-start;gap:12px;
  color:var(--v-onink);
  transition:margin-top .26s var(--ease), opacity .16s linear;}
/* 미끄러져 올라가면서 함께 흐려집니다. 그냥 밀려 올라가면 뚝 끊겨 보입니다. */
#chrome.up #header{margin-top:calc(-1 * var(--hh));opacity:0;}
#brandBtn{display:flex;align-items:center;gap:7px;background:none;border:none;
  color:var(--v-onink);font-family:inherit;padding:0;}
#brandBtn .logo{width:88px;height:auto;display:block;}
#brandBtn .chev{width:19px;height:19px;border:1px solid rgba(255,255,255,.34);border-radius:5px;
  display:flex;align-items:center;justify-content:center;transition:transform .25s var(--ease);}
#brandBtn .chev svg{width:12px;height:12px;}
#brandBtn.open .chev{transform:rotate(180deg);}
#header .app{font-size:11.5px;opacity:.62;margin-top:8px;margin-left:3px;}
#header .rt{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;}
/* 얇은 외곽선 + 얇은 글씨. 채워진 버튼이 아닙니다. */
#rfBtn{background:none;border:1px solid rgba(255,255,255,.3);border-radius:9px;
  color:var(--v-onink);font-family:inherit;font-size:11.5px;font-weight:400;padding:6px 13px;}
#rfBtn:active{background:rgba(255,255,255,.1);}
/* 도는 아이콘은 버튼이 아니라 갱신시각 옆에 있습니다 */
#stampRow{display:flex;align-items:center;gap:5px;margin-top:5px;
  font-size:10.5px;opacity:.55;font-variant-numeric:tabular-nums;}
#stampRow.stale{opacity:1;color:var(--v-stale);font-weight:700;}
#stampRow svg{width:11px;height:11px;}
#stampRow.busy svg{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

#tabs{display:flex;padding:0 8px;}
#tabs button{flex:1;padding:12px 4px 11px;border:none;background:none;font-family:inherit;
  font-size:13px;font-weight:600;color:rgba(255,255,255,.5);position:relative;}
#tabs button.on{color:#fff;font-weight:800;}
#tabs button.on::after{content:'';position:absolute;left:14%;right:14%;bottom:0;height:2.5px;
  background:#fff;border-radius:2px;}

.page{display:none;padding:16px 16px 0;}
/* 목록 끝 여백은 20px 이면 충분합니다.
   홈 인디케이터 몫은 #bottom 이 갖고 있으므로 여기에 또 넣으면 안 됩니다. */
.page.on{display:block;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:none;padding-bottom:20px;}

/* ── 카테고리 — 위에서 내려오는 판 ─────────────────── */
/* ⚠️ position:fixed 로 두면 키보드가 올라와 body 에 transform 이 걸리는 순간
   기준 상자가 바뀌어 판이 엉뚱한 자리에 그려집니다.
   body 가 position:fixed 이므로 absolute 로 두면 항상 앱 영역 기준입니다. */
#catWrap{position:absolute;left:0;right:0;top:0;z-index:61;pointer-events:none;}
#catPanel{background:var(--v-bg);border-bottom:1px solid var(--v-line);
  transform:translateY(-100%);transition:transform .3s var(--ease);
  padding:calc(14px + env(safe-area-inset-top)) 14px 0;pointer-events:auto;}
#catWrap.on #catPanel{transform:translateY(0);}
/* 링크가 늘어나도 판이 화면 밖으로 넘치지 않게 합니다 */
#catPanel{max-height:82vh;overflow-y:auto;overscroll-behavior:none;}
#catGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
#catGrid a{background:var(--v-card);border:1px solid var(--v-line);border-radius:12px;
  padding:15px 14px;text-decoration:none;display:block;}
#catGrid a .t{font-size:14.5px;font-weight:700;color:var(--v-strong);
  display:flex;align-items:center;gap:5px;}
#catGrid a .t svg{width:13px;height:13px;opacity:.45;}
#catGrid a .d{font-size:11px;color:var(--v-mute);margin-top:3px;}
#catClose{display:flex;justify-content:flex-end;padding:14px 4px;}
#catClose button{background:none;border:none;font-family:inherit;font-size:12.5px;
  font-weight:600;color:var(--v-mute);text-decoration:underline;text-underline-offset:3px;}
#scrim{position:absolute;inset:0;background:rgba(20,22,17,.42);z-index:60;opacity:0;
  pointer-events:none;transition:opacity .25s var(--ease);}
#scrim.on{opacity:1;pointer-events:auto;}

/* ── 세그먼트 ────────────────────────────────────
   .seg-nav  화면을 바꾸는 탐색용 — 밑줄 막대
   .seg-pick 값을 고르는 컨트롤 — 버튼 (테마 전환 등) */
.seg-nav{display:flex;gap:2px;border-bottom:1px solid var(--v-line);margin:-4px -16px 16px;
  padding:0 16px;overflow-x:auto;scrollbar-width:none;}
.seg-nav::-webkit-scrollbar{display:none;}
.seg-nav button{border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;
  color:var(--v-mute);padding:9px 12px 10px;position:relative;white-space:nowrap;}
.seg-nav button.on{color:var(--v-strong);font-weight:800;}
.seg-nav button.on::after{content:'';position:absolute;left:8px;right:8px;bottom:-1px;height:2.5px;
  background:var(--v-strong);border-radius:2px;}

.seg-pick{display:flex;gap:4px;background:var(--v-seg);border-radius:11px;padding:4px;}
.seg-pick button{flex:1;padding:9px 4px;border:none;border-radius:8px;background:none;
  font-family:inherit;font-size:12px;font-weight:700;color:var(--v-mute);white-space:nowrap;}
.seg-pick button.on{background:var(--v-card);color:var(--v-strong);
  box-shadow:0 1px 3px rgba(0,0,0,.08);}

/* ── 카드 · 입력 ──────────────────────────────────
   -webkit-user-select:text 가 없으면 독립 앱 모드에서 칸이 '선택만 되고
   편집은 안 되는' 상태로 빠져 키보드가 올라오지 않습니다. */
.card{background:var(--v-card);border:1px solid var(--v-line);border-radius:var(--v-radius);
  padding:16px;margin-bottom:12px;}
.card h3{font-size:12px;color:var(--v-mute);font-weight:700;margin-bottom:12px;}
select,input.f,button.f,textarea.f{width:100%;padding:13px 14px;border:1px solid var(--v-line);
  border-radius:12px;font-size:16px;margin-bottom:9px;font-family:inherit;
  background:var(--v-soft);color:var(--v-txt);touch-action:manipulation;}
select{-webkit-appearance:none;appearance:none;padding-right:36px;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
  background-repeat:no-repeat;background-position:right 12px center;background-size:16px;}
select.ph{color:var(--v-ph);}
input.f,textarea.f{-webkit-user-select:text;user-select:text;}
textarea.f{resize:vertical;line-height:1.6;font-size:15px;}
input.f::placeholder,textarea.f::placeholder{color:var(--v-ph);}
input.f:focus,select:focus,textarea.f:focus{outline:none;border-color:var(--v-accent);
  background:var(--v-card);}
button.f{background:var(--v-cta);color:var(--v-cta-txt);border:none;font-weight:700;margin-top:3px;}
button.f:disabled{opacity:.5;}
button.ghost{background:transparent;color:var(--v-strong);border:1px solid var(--v-line);
  font-weight:600;}
/* [초기화][검색] 처럼 나란히 두는 버튼 */
.btn2{display:flex;gap:8px;}
.btn2 button.f{flex:1;width:auto;margin-bottom:0;}
/* select 와 input 은 브라우저 기본 높이가 달라 그냥 두면 줄이 어긋납니다 */
select.fld,input.f.fld{height:46px;padding:0 14px;margin-bottom:0;}
select.fld{padding-right:36px;}
.lb2{font-size:11px;color:var(--v-mute);margin:11px 0 5px;}
.lb2:first-child{margin-top:2px;}

/* ── 구획 머리 — 이모지 대신 점 ───────────────────── */
.sec{display:flex;align-items:center;gap:8px;margin:20px 0 9px;font-size:12.5px;
  font-weight:700;color:var(--v-strong);}
.sec .cnt{margin-left:auto;font-size:11.5px;color:var(--v-mute);font-weight:600;
  font-variant-numeric:tabular-nums;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block;
  background:var(--v-mute);}
.dot.ok{background:var(--v-ok);} .dot.warn{background:var(--v-warn);}
.dot.danger{background:var(--v-danger);} .dot.mute{background:var(--v-ph);}
.dot.d1{background:var(--v-d1);} .dot.d2{background:var(--v-d2);}
.dot.d3{background:var(--v-d3);} .dot.d4{background:var(--v-d4);}

/* ── 안내 상자 ────────────────────────────────────── */
.box{border-radius:12px;padding:13px 15px;margin-bottom:12px;font-size:12.5px;line-height:1.75;
  border:1px solid;}
.box.ok{background:var(--v-ok-bg);border-color:var(--v-ok-line);color:var(--v-ok);}
.box.note{background:var(--v-warn-bg);border-color:var(--v-warn-line);color:var(--v-warn);}
.box.danger{background:var(--v-danger-bg);border-color:var(--v-danger-line);color:var(--v-danger);}
.box b{font-weight:800;}
.box .hd{display:flex;align-items:center;gap:7px;font-weight:800;}
/* 점 색은 상자 글자색을 따라갑니다. 상자마다 따로 지정하면 어긋납니다. */
.box .hd .dot{background:currentColor;}
/* 머리줄 아래 간격을 한 곳에서 정합니다 — 상자마다 달라 보이지 않게 */
.box .bd{margin-top:9px;}
.box .bd > div + div{margin-top:11px;}

/* ⚠️ 이름을 .empty 로 씁니다.
   .note 로 두면 주의 상자(.box.note)와 겹쳐 가운데 정렬과 큰 여백이 몰래 덧붙습니다. */
.empty{font-size:12px;color:var(--v-mute);text-align:center;padding:22px 14px;line-height:1.7;}
.empty.err{color:var(--v-danger);}

/* ── 표 ───────────────────────────────────────────── */
.tbl{background:var(--v-card);border:1px solid var(--v-line);border-radius:var(--v-radius);
  overflow:hidden;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{padding:9px 12px;text-align:right;font-size:10.5px;font-weight:600;color:var(--v-mute);
  background:var(--v-thead);white-space:nowrap;}
th:first-child{text-align:left;}
td{padding:11px 12px;border-top:1px solid var(--v-line);text-align:right;
  font-variant-numeric:tabular-nums;}
td:first-child{text-align:left;}
tbody tr:first-child td{border-top:none;}
tr.sum td{background:var(--v-thead);font-weight:800;}
.sub2{font-size:10.5px;color:var(--v-mute);line-height:1.6;margin-top:2px;}
.muted{color:var(--v-ph);}
.dg,.danger{color:var(--v-danger);font-weight:700;}
.ok{color:var(--v-ok);font-weight:700;}
.hl{color:var(--v-danger);font-weight:700;}
.hr{height:1px;background:var(--v-line);margin:11px 0;}
.more{color:var(--v-strong);font-weight:800;text-decoration:underline;text-underline-offset:3px;
  margin-left:6px;font-size:12px;}
.foot-note{font-size:11px;color:var(--v-mute);line-height:1.85;padding:2px 2px 6px;}
.msg{font-size:12px;margin-top:8px;min-height:16px;line-height:1.6;}
.msg.err{color:var(--v-danger);} .msg.good{color:var(--v-ok);}

details{background:var(--v-card);border:1px solid var(--v-line);border-radius:var(--v-radius);
  margin-bottom:12px;overflow:hidden;}
details summary{list-style:none;padding:13px 15px;font-size:12.5px;font-weight:700;
  color:var(--v-strong);display:flex;align-items:center;gap:8px;}
details summary::-webkit-details-marker{display:none;}
details summary .cnt{margin-left:auto;font-size:11.5px;color:var(--v-mute);font-weight:600;
  font-variant-numeric:tabular-nums;}
details summary .chev{transition:transform .2s var(--ease);color:var(--v-mute);display:flex;}
details[open] summary .chev{transform:rotate(90deg);}
details .tbl{border:none;border-radius:0;border-top:1px solid var(--v-line);margin:0;}
/* 펼쳤을 때 안쪽에 카드 목록이 들어가는 경우 */
details .inner{padding:12px 12px 2px;border-top:1px solid var(--v-line);background:var(--v-bg);}
/* 안에 카드가 아니라 내용이 바로 들어가는 경우 (그래프 · 금액) —
   카드 안에 카드를 또 그리면 테두리가 두 겹으로 보입니다. */
details .inner.plain{background:var(--v-card);padding:14px 15px 8px;}
details .inner .it:last-child{margin-bottom:12px;}

/* ── 하단 내비 ────────────────────────────────────── */
/* 아래 여백은 JS(fitBottom)가 기기에 맞춰 넣습니다.
   앱 바깥으로 남는 자리가 이미 홈 인디케이터를 덮는 기기가 있어,
   env() 를 그대로 쓰면 같은 여백이 두 번 들어갑니다. */
#bottom{flex-shrink:0;display:flex;background:var(--v-card);border-top:1px solid var(--v-line);
  padding-bottom:var(--navpad, 8px);z-index:40;}
#bottom button{flex:1;border:none;background:none;font-family:inherit;padding:6px 0 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--v-ph);}
#bottom button.on{color:var(--v-strong);}
#bottom svg{width:21px;height:21px;}
#bottom .lb{font-size:10px;font-weight:600;}

/* ── 마이페이지 ───────────────────────────────────── */
.mp-top{display:flex;align-items:center;gap:13px;padding:6px 2px 22px;}
.mp-top .av{width:46px;height:46px;border-radius:50%;background:var(--v-accent2);flex-shrink:0;}
.mp-top .who{font-size:17px;font-weight:800;color:var(--v-strong);}
.mp-top .rt{margin-left:auto;}
.mp-top .role{font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:9px;
  background:var(--v-ok-bg);color:var(--v-ok);border:1px solid var(--v-ok-line);}
.mp-blk{border-top:1px solid var(--v-line);padding:18px 2px 4px;}
.mp-blk .ttl{font-size:11.5px;font-weight:700;color:var(--v-mute);margin-bottom:11px;}
/* 라벨과 컨트롤을 한 줄에 두는 블록 (테마 전환) */
.mp-blk.mp-row{display:flex;align-items:center;gap:12px;padding:14px 2px;}
.mp-blk.mp-row .ttl{margin-bottom:0;}
.mp-blk.mp-row .seg-pick{margin-left:auto;width:200px;flex-shrink:0;}
.ver{text-align:center;font-size:11px;color:var(--v-ph);padding:26px 0 16px;line-height:1.7;}
#outBtn{margin-bottom:4px;}

.log-r{padding:12px 2px;border-top:1px solid var(--v-line);font-size:12.5px;}
.log-r:first-child{border-top:none;}
.log-r .l1{display:flex;gap:9px;align-items:baseline;}
.log-r .l1 b{color:var(--v-txt);}
.log-r .t{font-size:11px;color:var(--v-ph);font-variant-numeric:tabular-nums;margin-left:auto;
  white-space:nowrap;}
.log-r .l2{font-size:11.5px;color:var(--v-mute);margin-top:3px;word-break:break-all;}
/* 질문 미리보기는 두지 않습니다 — 잘린 문장은 읽히지도 않으면서 줄만 늘립니다.
   이름 바로 옆 [상세보기]를 누르면 아래에 질문과 답변이 펼쳐집니다.
   굵지만 연한 글씨 + 밑줄 — 눌러야 할 곳이라는 건 보이되 이름보다 앞서 읽히지는 않게. */
.log-r .more{font-size:12px;font-weight:800;color:var(--v-mute);text-decoration:underline;
  text-underline-offset:3px;background:none;border:none;font-family:inherit;padding:0;
  flex-shrink:0;}
.log-r .more.open{color:var(--v-strong);}
.log-r .aibadge{font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:1px 6px;
  border-radius:6px;background:var(--v-ai-bg);border:1px solid var(--v-ai-line);
  color:var(--v-ai-txt);flex-shrink:0;}
.log-qa{margin-top:9px;}
.log-qa .k{font-size:10.5px;color:var(--v-mute);font-weight:700;margin-bottom:3px;}
.log-qa .v{background:var(--v-soft);border:1px solid var(--v-line);border-radius:10px;
  padding:10px 12px;font-size:12px;line-height:1.75;white-space:pre-wrap;word-break:break-word;
  color:var(--v-txt);margin-bottom:8px;}
.log-qa a{color:var(--v-link);}

/* ══════════════════════════════════════════════════
   여기부터 시딩 앱에만 있는 것
   ══════════════════════════════════════════════════ */

/* ── 진행 상태 뱃지 7종 ────────────────────────────
   ⚠️ 색 코드를 직접 쓰지 않습니다. 상태 토큰 조합이라 다크에서 함께 따라옵니다. */
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:9px;white-space:nowrap;
  display:inline-block;background:var(--v-gray-bg);color:var(--v-gray-tx);}
.b-발송대기{background:var(--v-gray-bg);color:var(--v-gray-tx);}
.b-업로드대기{background:var(--v-warn-bg);color:var(--v-warn);}
.b-게시중{background:var(--v-ok-bg);color:var(--v-ok);}
.b-미업로드{background:var(--v-warn-bg);color:var(--v-warn);}
.b-종료{background:var(--v-gray-bg);color:var(--v-mute);}
.b-대가없음{background:var(--v-lav-bg);color:var(--v-lav-tx);}
.b-삭제{background:var(--v-danger-bg);color:var(--v-danger);}

/* ── 목록 항목 카드 ──────────────────────────────── */
.it{background:var(--v-card);border:1px solid var(--v-line);border-radius:var(--v-radius);
  margin-bottom:9px;overflow:hidden;}
.it .hd{padding:13px 14px;display:flex;align-items:flex-start;gap:9px;}
.it .nm{font-weight:700;font-size:14px;color:var(--v-strong);}
.it .meta{font-size:11px;color:var(--v-mute);margin-top:3px;line-height:1.6;}
.it .right{margin-left:auto;text-align:right;flex-shrink:0;}
.it .bd{display:none;padding:0 14px 14px;border-top:1px solid var(--v-line);}
.it.open .bd{display:block;}
.dd{font-size:11px;font-weight:700;margin-top:4px;}
.dd.over{color:var(--v-danger);} .dd.soon{color:var(--v-warn);} .dd.ok{color:var(--v-mute);}
.dd.rent{color:var(--v-d3);}
/* 카드에 바로 붙는 빠른 실행 버튼 */
.qa{display:flex;gap:6px;padding:0 14px 12px;flex-wrap:wrap;}
.qa button{flex:1;min-width:74px;padding:10px 6px;font-size:12.5px;border-radius:10px;
  border:1px solid var(--v-line);background:var(--v-card);color:var(--v-strong);font-weight:700;
  font-family:inherit;}
.qa button.pri{background:var(--v-cta);color:var(--v-cta-txt);border:none;}
.qa button.no{color:var(--v-danger);border-color:var(--v-danger-line);}
.qmsg{font-size:11.5px;padding:0 14px 10px;}
.qmsg.err{color:var(--v-danger);} .qmsg.good{color:var(--v-ok);}
.acts{margin-top:10px;}
.acts input.f{margin-bottom:8px;}
.acts .fld + .lb2{margin-top:12px;}

/* 키-값 목록 */
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;color:var(--v-mute);
  line-height:1.95;padding-top:11px;}
.kv b{font-weight:700;color:var(--v-txt);}
.kv a{color:var(--v-link);word-break:break-all;text-decoration:underline;
  text-underline-offset:3px;font-weight:700;}
/* 링크가 걸린 글자는 전부 [URL] 한 가지로 통일합니다 */
a.url{color:var(--v-link);font-weight:700;text-decoration:underline;text-underline-offset:3px;}
.box2{background:var(--v-soft);border:1px solid var(--v-line);border-radius:11px;
  padding:10px 12px;margin-top:10px;}

/* ── 공지 블록 ───────────────────────────────────── */
.notice{background:var(--v-card);border:1px solid var(--v-line);border-radius:var(--v-radius);
  padding:16px 18px;margin-bottom:12px;font-size:13.5px;line-height:2.1;}
.notice .ttl{font-size:12px;color:var(--v-mute);font-weight:700;margin-bottom:8px;}
.notice b{font-variant-numeric:tabular-nums;color:var(--v-txt);}
.notice .big{font-size:22px;font-weight:800;color:var(--v-strong);
  font-variant-numeric:tabular-nums;}

/* ── 그래프 (외부 라이브러리 없이 CSS로만) ────────── */
.chart{background:var(--v-card);border:1px solid var(--v-line);border-radius:var(--v-radius);
  padding:15px;margin-bottom:12px;}
.chart h3{font-size:12.5px;color:var(--v-strong);margin-bottom:13px;font-weight:700;}
.vbars{display:flex;align-items:flex-end;gap:4px;height:150px;}
.vcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0;}
.vcol .tot{font-size:10px;color:var(--v-mute);text-align:center;font-weight:700;margin-bottom:3px;
  font-variant-numeric:tabular-nums;}
.vcol .stack{display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;}
.vcol .seg{width:100%;display:flex;align-items:center;justify-content:center;}
.vcol .seg span{font-size:9px;font-weight:700;color:#fff;line-height:1;
  text-shadow:0 0 2px rgba(20,22,17,.35);}
.vcol .lb{font-size:9px;color:var(--v-mute);text-align:center;margin-top:5px;white-space:nowrap;}
.hbar{margin-bottom:11px;}
.hbar .top{display:flex;font-size:12.5px;color:var(--v-txt);margin-bottom:5px;}
.hbar .top b{margin-left:auto;font-variant-numeric:tabular-nums;}
.hbar .track{height:9px;background:var(--v-track);border-radius:5px;overflow:hidden;}
.hbar .fill{height:100%;border-radius:5px;}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11px;color:var(--v-mute);}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;
  vertical-align:middle;}
.donut{display:flex;align-items:center;gap:18px;}

/* ── 채팅 — 하단 내비에서 여는 전체 화면 ────────────
   ⚠️ position:absolute 입니다. body 가 position:fixed 라 이 판은 body 상자를
      그대로 따라갑니다. 키보드가 올라와 JS 가 body 높이를 줄이면 입력줄도

.cmsg.me{align-self:flex-end;background:var(--v-cta);color:var(--v-cta-txt);
  border-bottom-right-radius:5px;}
/* 흰(카드) 말풍선 = 저장된 데이터에서 바로 찾은 답. 토큰이 들지 않습니다. */

  color:var(--v-txt);border-bottom-left-radius:5px;}

body.kb #chatFoot{padding-bottom:8px;}

/* ── 상태 ─────────────────────────────────────────

let PW='', USER='', ROLE='', D=null, FEAT=null;
let PAGE='p1', LASTMAIN='p1', NAV='home', LOGVIEW='access';
let LOGS=[], logsLoaded=false, BUSY=false, LAST=0;
let OPEN={}, OPT_CACHE='';
let V2='dash', V3='dash';
let PENDING_Q='', CARDS=[], CARDN=0;
let SPLASH_ON = true;
let CHAT_ON = false;
const IDEM = {};   /* 멱등키 — 같은 작업을 다시 눌러도 서버가 중복을 걸러낸다 */

/* ── 작은 도구 ────────────────────────────────────── */
const $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
/* onclick="fn('...')" 안에 들어가는 문자열용.
   esc 로 작은따옴표를 바꾸는 방법은 통하지 않습니다 — 브라우저가 속성값을
   먼저 디코딩한 뒤 JS 로 파싱하기 때문에 다시 ' 로 돌아옵니다. */
function jsq(s){
  return String(s==null?'':s)
    .replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;')
    .replace(/</g,'\\x3C').replace(/\r?\n/g,' ');
}
function num(v){
  if(v===''||v===null||v===undefined) return null;
  const x = Number(v);
  return isNaN(x) ? null : x;
}
function n(v){ const x=num(v); return x===null ? '—' : x.toLocaleString('ko-KR'); }
function setHTML(id,h){ const e=$(id); if(e) e.innerHTML=h; }
function setVal(id,v){ const e=$(id); if(e) e.value=(v||''); }
function setDisp(id,v){ const e=$(id); if(e) e.style.display=v; }
function val(id){ const e=$(id); return e ? e.value : ''; }
function dayGap(from,to){
  const a=new Date(from+'T00:00:00'), b=new Date(to+'T00:00:00');
  if(isNaN(a)||isNaN(b)) return 9999;
  return Math.round((b-a)/86400000);
}
function linkify(t){
  return esc(t).replace(/(https?:\/\/[^\s<]+)/g, function(u){
    return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'; });
}
/* 글자를 칠 때마다 목록을 다시 그리면 느립니다. 잠시 모아서 한 번만 그립니다. */
let debT=null;
function deb(fn, ms){ clearTimeout(debT); debT=setTimeout(fn, ms||250); }
/* 접었다 펴는 공통 동작 (2차활용 상세 · 금액 상자 등) */
function toggleBox(id){
  const e=$(id); if(!e) return;
  const hidden=(e.style.display==='none');
  e.style.display = hidden ? (e.tagName==='TR' ? 'table-row' : 'block') : 'none';
}

/* 접근로그 [상세보기] — 펼친 줄은 글자색이 진해져 어디를 열었는지 보입니다 */
function toggleQA(id, btn){
  const e=$(id); if(!e) return;
  const open = (e.style.display==='none');
  e.style.display = open ? 'block' : 'none';
  if(btn){
    btn.classList.toggle('open', open);
    btn.textContent = open ? '접기' : '상세보기';
  }
}

function store(k,v){
  try{
    if(v===undefined) return localStorage.getItem(k);
    if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);
  }catch(e){ return null; }
}

/* ── 아이콘 (이모지 대신 단색 SVG) ────────────────── */
const ICON = {
  refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.4"/><polyline points="21 3 21 9 15 9"/>',
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.6V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.6"/>',
  user:'<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>',
  chat:'<path d="M21 3 2.5 10.3l7.4 3.1 3.1 7.4z"/><path d="M9.9 13.4 21 3"/>',
  down:'<polyline points="6 9 12 15 18 9"/>',
  chev:'<polyline points="9 6 15 12 9 18"/>',
  up:'<path d="M12 19V5"/><polyline points="6 11 12 5 18 11"/>',
  close:'<path d="M6 6l12 12"/><path d="M18 6 6 18"/>',
  ext:'<path d="M14 4h6v6"/><path d="M20 4l-8.5 8.5"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'
};
function ic(name,size){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '+
    'stroke-linecap="round" stroke-linejoin="round"'+
    (size?' style="width:'+size+'px;height:'+size+'px"':'')+'>'+ICON[name]+'</svg>';

/* ── 색 토큰 읽기 ─────────────────────────────────
   그래프는 인라인 색을 쓰므로 실제 색값이 필요합니다.
   매번 getComputedStyle 을 부르면 느려서 한 번 읽은 값은 담아 둡니다.
   테마가 바뀌면 통째로 버립니다. */
let TOKC = {};
function tok(name){
  if(TOKC[name]) return TOKC[name];
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  if(v) TOKC[name]=v;
  return v;
}

/* ── 테마 — 로그인 정보가 아니라 개인 취향이므로 로그아웃해도 유지 ──
   스플래시보다 먼저 적용합니다. 라이트로 떴다가 다크로 바뀌면 눈이 부십니다. */
let THEME = store(STORE.theme) || 'light';
applyTheme(THEME, true);

function applyTheme(v, first){
  THEME = v;
  document.documentElement.dataset.theme = v;
  TOKC = {};                      /* 색값 캐시를 버립니다 */
  if(!first){
    canvas();
    /* 그래프는 인라인 색을 쓰므로 테마를 바꾸면 다시 그려야 색이 따라옵니다 */
    if(D) renderAll();
  }
  /* 스플래시와 헤더는 언제나 어두운 배경이라 밝은 로고를 씁니다.
     로그인 화면만 배경이 테마를 따라가므로 로고도 함께 바꿉니다. */
  const gl = $('gateLogo');
  if(gl) gl.src = (v==='dark') ? LOGO.light : LOGO.dark;
}

/* ── 권한 ─────────────────────────────────────────
   서버가 모르는 role 을 보내도 권한이 닫히는 쪽으로 떨어집니다. */
function perm(){ return PERM[ROLE] || NOPERM; }
function can(k){
  /* 서버가 features 로 "그 기능 자체가 없다"고 하면 권한과 무관하게 닫습니다 */
  if(FEAT && FEAT[k]===false) return false;
  return !!perm()[k];
}

/* ── 통신 ─────────────────────────────────────────
   Apps Script 는 CORS preflight 를 처리하지 못하므로 전부 GET 으로 보냅니다.
   fetch 에는 기본 제한 시간이 없습니다. 없으면 서버가 답하지 않을 때
   영원히 기다리며 앱이 통째로 먹통이 됩니다. */
function tmo(mode){
  if(mode==='write') return TIMEOUT.write;
  if(mode==='ai')    return TIMEOUT.ai;
  return TIMEOUT.read;
}
async function api(params, opt){
  opt = opt || {};
  const q = new URLSearchParams();
  q.set('key', PW); q.set('user', USER);
  Object.keys(params||{}).forEach(function(k){
    if(params[k]!==undefined && params[k]!==null) q.set(k, params[k]);
  });
  /* idem 을 주면 같은 작업을 다시 보낼 때 같은 reqId 가 실려 나갑니다.
     서버가 reqId 를 기억해 두면 중복 저장이 원천 차단됩니다. */
  if(opt.mode==='write'){
    const k = opt.idem;
    if(k){
      if(!IDEM[k] || Date.now()-IDEM[k].t > 600000){
        IDEM[k] = { id:Date.now().toString(36)+Math.random().toString(36).slice(2,8), t:Date.now() };
      }
      q.set('reqId', IDEM[k].id);
    }
  }
  const ctl = new AbortController();
  const timer = setTimeout(function(){ ctl.abort(); }, tmo(opt.mode));
  try{
    const res = await fetch(SCRIPT_URL+'?'+q.toString(), { method:'GET', signal:ctl.signal });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    /* 저장이 성공했으면 그 멱등키는 더 쓰지 않습니다 (다음 저장은 새 건이므로) */
    if(opt.mode==='write' && opt.idem && json && json.ok) delete IDEM[opt.idem];
    return json;
  } finally { clearTimeout(timer); }
}
function isTimeout(e){ return e && (e.name==='AbortError' || /aborted/i.test(String(e.message))); }
function failMsg(e, tail){
  /* 시간 초과는 실패가 아니라 "모름"입니다. 서버는 계속 실행 중일 수 있습니다.
     그래서 "다시 시도하세요"가 아니라 확인부터 안내합니다. */
  return isTimeout(e)
    ? ('응답을 받지 못했습니다. ' + (tail || '새로고침으로 반영 여부를 먼저 확인하세요.'))
    : ('통신에 실패했습니다. ' + (tail || '잠시 후 다시 시도하세요.'));
}

/* ── 화면 높이 · 키보드 ────────────────────────────
   iOS 는 키보드가 올라올 때 두 가지를 합니다.
     ① 보이는 높이를 줄인다      → visualViewport.height
     ② 화면 전체를 위로 밀어올린다 → visualViewport.offsetTop
   ①만큼 body 높이를 줄이고, ②만큼 도로 내려 제자리에 붙입니다.

   ⚠️ offsetTop 은 손가락으로 화면을 당길 때도 변합니다. 무조건 따라가면
      화면이 손가락을 따라다닙니다. "120px 넘게 줄었을 때 = 키보드" 일 때만 보정합니다. */
function keyboardOpen(){
  const vv = window.visualViewport;
  return !!vv && (window.innerHeight - vv.height > 120);
}
/* iOS 는 화면 높이를 상황에 따라 다르게 알려줍니다.
   그대로 따라가면 하단 내비가 왔다갔다 하고, 가장 큰 값으로 잡으면 화면 밖으로
   밀려 사라집니다. 그래서 처음 잰 값에 못박고 화면을 돌릴 때만 다시 잽니다. */
let PINH = 0, PINW = 0;
function fullHeight(){
  const w = window.innerWidth || 0;
  if(!PINH || w !== PINW){
    PINH = window.innerHeight || (window.visualViewport ? window.visualViewport.height : 0);
    PINW = w;
  }
  return PINH;
}
/* 로그인 화면에서 키보드에 가리지 않도록 입력 덩어리를 밀어 올립니다.
   visH 가 null 이면 원래 자리로 돌아갑니다. */
function liftGate(visH){
  const el = $('gateIn');
  if(!el) return;
  if(visH === null){ el.style.transform = 'none'; return; }
  /* offsetTop·offsetHeight 는 transform 의 영향을 받지 않습니다.
     getBoundingClientRect 를 쓰면 이미 밀어 둔 값이 섞여 계산이 어긋납니다. */
  const h    = el.offsetHeight;
  const want = Math.max(14, (visH - h) / 2);
  el.style.transform = 'translateY(' + Math.round(want - el.offsetTop) + 'px)';
}

/* 직전에 잰 키보드 높이. 두 번째부터는 이 값으로 미리 움직입니다. */
let KBH = 0;

function applyViewportHeight(){
  const vv = window.visualViewport;
  const b  = document.body.style;
  const onGate = $('gate') && $('gate').classList.contains('on');
  b.bottom = 'auto';
  if(keyboardOpen() && onGate){
    /* 로그인 화면은 높이를 그대로 둡니다. 줄이는 순간 위아래 여백이 다시
       계산되면서 내용이 툭 튀어오릅니다. 대신 덩어리만 미끄러뜨립니다. */
    b.height = fullHeight() + 'px';
    b.transform = vv.offsetTop ? 'translateY(' + vv.offsetTop + 'px)' : 'none';
    KBH = Math.round(fullHeight() - vv.height);
    liftGate(vv.height);
    document.body.classList.remove('kb');
  }else if(keyboardOpen()){
    /* 본 화면 · 채팅 — ①만큼 줄이고 ②만큼 도로 내려 제자리에 붙입니다.
       채팅 판(#chatWrap)은 body 상자를 따라가므로 입력줄이 키보드 위에 붙습니다. */
    b.height = vv.height + 'px';
    b.transform = vv.offsetTop ? 'translateY(' + vv.offsetTop + 'px)' : 'none';
    document.body.classList.add('kb');
  }else{
    b.height = fullHeight() + 'px';
    b.transform = 'none';
    liftGate(null);
    document.body.classList.remove('kb');
  }
}
let vpT = null;
function applyViewportSoon(){
  /* 로그인 화면은 transform 만 움직이므로 미룰 이유가 없습니다.
     본 화면은 높이를 바꾸므로 연달아 오는 알림을 한 번으로 묶습니다. */
  if($('gate') && $('gate').classList.contains('on')){
    clearTimeout(vpT); applyViewportHeight(); return;
  }
  clearTimeout(vpT); vpT = setTimeout(function(){ applyViewportHeight(); chatScrollEnd(); }, 60);
}

if(window.visualViewport){
  window.visualViewport.addEventListener('resize', applyViewportSoon);
  /* scroll 은 손가락으로 당길 때도 오므로 키보드가 올라와 있을 때만 반응합니다 */
  window.visualViewport.addEventListener('scroll', function(){
    if(keyboardOpen()) applyViewportSoon();
  });
}
window.addEventListener('resize', applyViewportHeight);
/* ⚠️ 키보드가 다 올라온 뒤에야 visualViewport 가 알려주는 기기가 있습니다.
   그때 움직이기 시작하면 언제나 반 박자 늦습니다.
   그래서 칸을 누르는 순간 먼저 출발시키고, 실제 값이 오면 조용히 맞춥니다.
   첫 번째만 어림값(화면의 42%)을 쓰고 그 뒤로는 직전에 잰 값을 씁니다. */
document.addEventListener('focusin', function(e){
  if(!e.target || !e.target.closest || !e.target.closest('#gateIn')) return;
  if(keyboardOpen()) return;                 /* 이미 올라와 있으면 그대로 */
  const full = fullHeight();
  liftGate(full - (KBH || Math.round(full * 0.42)));
});
/* 키보드가 내려간 뒤 남은 자리를 정리합니다 */
document.addEventListener('focusout', function(){
  /* 다른 칸으로 옮기는 중이면 키보드는 내려가지 않습니다 */
  setTimeout(function(){
    const a = document.activeElement;
    if(a && a.closest && a.closest('#gateIn')) return;
    liftGate(null);
  }, 0);
  setTimeout(applyViewportHeight, 300);
});
applyViewportHeight();

/* ── 스플래시 → 로그인 또는 자동 로그인 ───────────── */
function ready(){ SPLASH_ON = false; canvas(); }

/* 지금 보고 있는 화면에 맞춰 문서 바탕색을 직접 칠합니다.
     스플래시 = 올리브 (아래까지 전부 초록)
     본 화면  = 하단 내비와 같은 색 (내비가 끝까지 이어져 보이도록)
     로그인   = 앱 배경색
   ⚠️ 'var(--v-card)' 를 인라인으로 넣으면 무시되는 기기가 있어
      계산된 색값(#FFFFFF 같은)을 직접 넣습니다. */
function canvas(){
  const c = SPLASH_ON ? '#30382A'
    : CHAT_ON ? (tok('--v-bg') || '#F7F6F1')   /* 채팅 — 입력줄 아래가 같은 색으로 */
    : ($('app').classList.contains('on')
        ? (tok('--v-card') || '#FFFFFF')   /* 본 화면 — 하단 내비와 같은 색 */
        : (tok('--v-bg')   || '#F7F6F1')); /* 로그인 화면 */
  document.documentElement.style.background = c;
  document.body.style.background = c;
}

setTimeout(function(){
  $('splash').classList.add('gone');
  ready();
  setTimeout(function(){ $('splash').style.display='none'; }, 480);
}, 1000);

$('verLine').textContent = APP_VER;
$('verFoot').textContent = '시딩관리 ' + APP_VER;

async function autoLogin(){
  try{
    const r = await api({});
    if(r && r.ok){ enter(r); return; }
  }catch(e){ /* 아래에서 로그인 화면을 띄웁니다 */ }
  PW=''; store(STORE.pw, null);
  $('gate').classList.add('on');
  gmsg('비밀번호가 변경되었습니다. 다시 입력해 주세요.', false);
}

/* ── 로그인 ───────────────────────────────────────── */
function showGate(){
  $('gate').classList.add('on');
  $('app').classList.remove('on');
  canvas();
  /* ready() 는 부르지 않습니다. 스플래시가 걷힐 때만 바탕색을 바꿉니다. */
}
function gmsg(t, wait){
  const el=$('gateMsg'); el.textContent=t||''; el.className = wait?'wait':'';
}

async function login(){
  const nm = (val('nm')||'').trim();
  const pw = (val('pw')||'').trim();
  if(!nm){ gmsg('이름을 입력하세요.'); return; }
  if(!pw){ gmsg('비밀번호를 입력하세요.'); return; }
  const btn=$('loginBtn'); btn.disabled=true;
  gmsg('접속 중입니다. 잠시만 기다려주세요.', true);
  PW = pw; USER = nm;
  try{
    const r = await api({});
    if(!r || !r.ok){
      PW=''; gmsg((r && r.msg) || '비밀번호가 올바르지 않습니다.');
      return;
    }
    store(STORE.pw, pw); store(STORE.user, nm);
    setVal('pw','');
    enter(r);
  }catch(e){
    PW=''; gmsg(failMsg(e,'[로그인]을 다시 눌러주세요.'));
  }finally{ btn.disabled=false; }
}

function enter(r){
  $('gate').classList.remove('on');
  $('app').classList.add('on');
  canvas();
  gmsg('');
  ROLE = r.role || '';
  boot(r);
}

function logout(){
  PW=''; ROLE=''; D=null; FEAT=null; LOGS=[]; logsLoaded=false;
  OPEN={}; OPT_CACHE=''; V2='dash'; V3='dash';
  PENDING_Q=''; CARDS=[]; CARDN=0;
  store(STORE.pw, null);
  LEGACY.forEach(function(k){ store(k, null); });
  /* 화면을 건드리기 전에 값부터 지웁니다 — 화면 쪽에서 오류가 나도 값은 반드시 지워지도록 */
  document.querySelectorAll('[data-clear]').forEach(function(e){ e.innerHTML=''; });
  document.querySelectorAll('[data-reset]').forEach(function(e){ e.value=''; });
  openChat(false);
  $('wm').style.display='none';
  $('app').classList.remove('on');
  $('gate').classList.add('on');
  canvas();
  NAV='home'; LASTMAIN='p1'; go('p1'); paintBottom();
}

/* 다른 탭에서 로그아웃하면 이쪽도 따라 나갑니다 */
window.addEventListener('storage', function(e){
  if(e.key===STORE.pw && !e.newValue && PW) logout();
});

/* ── 부팅 · 데이터 ────────────────────────────────── */
function boot(r){
  $('mpName').textContent = USER;
  $('verFoot').textContent = '시딩관리 ' + APP_VER;
  OPT_CACHE = '';
  setData(r);
  applyPerm();
  watermark();
  measure();
  chatReset();
  go('p1');
}

function setData(r){
  D = r;
  ROLE = r.role || ROLE;
  FEAT = r.features || null;
  LAST = Date.now();
  stamp(r.updated, false);
  $('mpRole').textContent = perm().label;

/* 헤더 갱신 시각. 실패하면 붉게 남겨 오래된 숫자를 최신으로 착각하지 않게 합니다.
   ⚠️ 앱마다 서버가 보내는 형식이 다릅니다.
      예전처럼 앞 5글자를 무조건 잘라내면 시각만 남아 어제 숫자인지
      오늘 숫자인지 구분할 수 없습니다.
      그래서 자르지 않고 형식을 알아본 뒤 'MM-dd HH:mm' 으로 맞춥니다. */
function fmtStamp(v){
  let s = String(v==null?'':v).trim().replace(/^갱신\s*/,'');
  if(!s) return '';
  s = s.replace(/^\d{4}[-./]/, '');            /* 연도가 붙어 있으면 뗀다 */
  if(/^\d{1,2}:\d{2}/.test(s)){                /* 시각만 왔으면 오늘 날짜를 붙인다 */
    const d = new Date(), p = function(x){ return String(x).padStart(2,'0'); };
    s = p(d.getMonth()+1)+'-'+p(d.getDate())+' '+s;
  }
  return s;
}
function stamp(updated, stale){
  const el=$('stamp');
  if(updated) el.textContent = fmtStamp(updated);   /* MM-dd HH:mm */
  $('stampRow').classList.toggle('stale', !!stale);
}

async function reload(showBusy){

  }
}

let lastY=0, ticking=false;
function measure(){
  document.documentElement.style.setProperty('--hh', $('header').offsetHeight+'px');
  fitBottom();
}

/* 하단 내비 아래 여백.
   화면 아래에 앱 바깥으로 남는 자리(gap)가 이미 홈 인디케이터를 덮으므로
   그만큼 덜어냅니다. 안 그러면 흰 영역이 120px 까지 두꺼워집니다. */
let NAVPAD = null;
function fitBottom(){
  if(NAVPAD !== null) return;
  let safe = 0;
  try{
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;bottom:0;left:0;width:1px;visibility:hidden;'+
      'pointer-events:none;height:env(safe-area-inset-bottom)';
    document.body.appendChild(probe);
    safe = probe.offsetHeight;
    probe.remove();
  }catch(e){}
  const scr = (window.screen && window.screen.height) ? window.screen.height : window.innerHeight;
  const gap = Math.max(0, scr - (window.innerHeight || scr));
  NAVPAD = Math.min(Math.max(safe - gap, 0), 34);
  document.documentElement.style.setProperty('--navpad', NAVPAD + 'px');
}
window.addEventListener('resize', function(){ measure(); if(PW) watermark(); });
function onScroll(e){
  const el = e.currentTarget;
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(function(){
    const y = el.scrollTop, hh = $('header').offsetHeight, d = y - lastY;
    if(y <= 0)                     setUp(false);
    else if(y > hh && d > THRESH)  setUp(true);
    else if(d < -THRESH)           setUp(false);
    lastY = y; ticking = false;
  });
}
function setUp(on){ $('chrome').classList.toggle('up', on); }

/* ── 표시 이름 · 순서 · 색 ────────────────────────── */
function catLabel(name){
  return (D && D.catLabels && D.catLabels[name]) || CAT_LABEL[name] || name;
}
/* 표시 순서 고정: 브랜더진 → 리뷰노트 → 무신사 → 개인협찬(구글폼) */
function catSort(list){
  const order = (D && D.catOrder) || ['브랜더진','리뷰노트','무신사','구글폼'];
  return list.slice().sort(function(a,b){
    const ai=order.indexOf(a), bi=order.indexOf(b);
    return (ai<0?99:ai)-(bi<0?99:bi);
  });
}
function catColor(name, i){
  /* 뒤의 값은 토큰을 읽지 못했을 때만 쓰는 마지막 방어선입니다 (Iron Gray) */
  return tok(CAT_TOKEN[name] || FALLBACK_TOKENS[(i||0) % FALLBACK_TOKENS.length]) || '#6D6462';
}

/* 접이식 — 제목 · 건수 · 안쪽 내용. open 이면 처음부터 펼쳐집니다. */
function fold(title, cnt, inner, open, dot){

    (dot ? '<span class="dot '+dot+'"></span>' : '')+esc(title)+

}

/* ── 드롭다운 ─────────────────────────────────────
   항목은 실제 데이터에 있는 값만 넣는다. 매번 새로 만들면 느리므로 바뀔 때만 그린다. */
function fillFilters(){
  if(!D || !D.items) return;
  const cats=[], prods=[];
  D.items.forEach(function(x){
    if(x.cat && cats.indexOf(x.cat)<0) cats.push(x.cat);
    if(x.product && prods.indexOf(x.product)<0) prods.push(x.product);
  });
  prods.sort();

  const sig = cats.join('|')+'##'+prods.join('|');
  if(sig===OPT_CACHE) return;
  OPT_CACHE = sig;

  const catOpt='<option value="">플랫폼 전체</option>'+
    cats.map(function(c){ return '<option value="'+esc(c)+'">'+esc(catLabel(c))+'</option>'; }).join('');
  const prodOpt='<option value="">상품 전체</option>'+
    prods.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join('');

  ['i','c','s','l'].forEach(function(k){
    const c=$(k+'Cat'), p=$(k+'Prod');
    if(!c||!p) return;
    const cv=c.value, pv=p.value;
    c.innerHTML=catOpt; p.innerHTML=prodOpt;
    c.value=cv; p.value=pv;
  });

  /* 2차활용 전체 전용 — 활용 채널 / 활용 기간 */
  const chan=$('lChan'), per=$('lPer');
  if(chan && per){
    const cvv=chan.value, pvv=per.value;
    chan.innerHTML='<option value="">활용 채널 전체</option>'+
      (D.secondTypes||[]).map(function(t){
        return '<option value="'+esc(t)+'">'+esc(t)+'</option>'; }).join('');
    per.innerHTML='<option value="">활용 기간 전체</option>'+
      (D.secondPeriods||[]).map(function(x){
        return '<option value="'+esc(x.t)+'">'+esc(x.t)+'</option>'; }).join('');
    chan.value=cvv; per.value=pvv;
  }
}

function applyFilter(k){

  const nm=(val(k+'Name')||'').trim().toLowerCase().replace(/^@/,'');
  let list=D.items;
  if(cat)  list=list.filter(function(x){ return x.cat===cat; });
  if(prod) list=list.filter(function(x){ return x.product===prod; });
  if(nm)   list=list.filter(function(x){
    return (x.name+' '+x.handle).toLowerCase().replace(/@/g,'').indexOf(nm)>=0; });
  return { list:list, empty:(!cat && !prod && !nm) };
}

   hot=true 인 줄은 0 보다 크면 붉게 — 봐야 할 숫자만 눈에 걸리게 합니다. */

/* 제목 + 둥근 표 한 칸. 성격이 다른 숫자는 칸을 나눠 담습니다. */
function statBox(title, rows){

    '<div class="tbl" style="margin-bottom:0"><table><tbody>'+rows+'</tbody></table></div>';

function renderToday(){
  const s=D.summary;
  const delDuring = D.items.filter(function(x){
    return x.state==='삭제' && x.postPeriod && x.delchk && x.delchk<=x.postPeriod; }).length;
  const todo = (s.needUpload||0) + (s.needPost||0) + delDuring;

  /* 마감일 당일부터 등장. [완료]를 눌러야 사라지고, [미완료]는 하루만 넘긴다. */
  const up = D.items.filter(function(x){ return x.flags.indexOf('needUpload')>=0; })
    .slice().sort(function(a,b){ return (a.dDeadline||0)-(b.dDeadline||0); });
  /* 업로드일(또는 마지막 확인일)로부터 7일마다 등장 */
  const post = D.items.filter(function(x){ return x.flags.indexOf('needPost')>=0; })
    .slice().sort(function(a,b){ return (a.dPost||0)-(b.dPost||0); });

  let h = fold('오늘 처리할 것', (todo>0 ? todo+'건' : '없음'),
    '<div class="inner">'+
      statBox('',
        statRow('업로드확인', s.needUpload, '건', true) +
        statRow('게시확인', s.needPost, '건', true) +
        statRow('게시기간 중 삭제확인', delDuring, '건', true))+
      PAD+'</div>',
    true, (todo>0 ? 'danger' : 'ok'));

  /* 건수가 0이면 묶음 자체를 만들지 않습니다 */
  if(up.length){
    h += fold('업로드확인', up.length+'건',
      '<div class="inner">'+
        '<div class="sub2" style="margin-bottom:10px">계정을 열어 확인한 뒤 '+
        '<b>완료</b> 또는 <b>미완료</b>를 눌러주세요. 미완료는 내일 다시 뜹니다.</div>'+
        up.map(function(x){ return itemHtml(x,'upc'); }).join('')+
      '</div>', false, 'warn');
  }
  if(post.length){
    h += fold('게시확인', post.length+'건',
      '<div class="inner">'+
        '<div class="sub2" style="margin-bottom:10px"><b>확인</b>을 누르면 7일 뒤에 '+
        '다시 뜹니다. 글이 내려갔으면 <b>미확인</b>을 누르세요.</div>'+
        post.map(function(x){ return itemHtml(x,'pst'); }).join('')+
      '</div>', false, 'd4');
  }

  /* 이번 달 기준 — 성격이 다른 숫자를 한 표에 몰아넣으면 눈이 미끄러집니다.
     진행 · 금액 · 확인 필요 · 플랫폼별 네 칸으로 나눕니다. */
  h += fold(s.ym.replace('-','.')+' 기준', n(s.total)+'건',
    '<div class="inner">'+

/* ── 그래프 조각 ──────────────────────────────────── */
function recentMonths(cnt){
  const out=[], d=new Date();
  for(let i=cnt-1;i>=0;i--){
    const t=new Date(d.getFullYear(), d.getMonth()-i, 1);
    out.push(t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0'));
  }
  return out;
}
/* 세로 누적 막대 — 시간 흐름을 왼쪽에서 오른쪽으로 읽게 한다 */
function stackedBars(months, cats, matrix){
  let max=1;
  months.forEach(function(m,i){
    let sum=0; cats.forEach(function(c){ sum+=matrix[c][i]||0; });
    if(sum>max) max=sum;
  });
  const cols=months.map(function(m,i){
    let sum=0; cats.forEach(function(c){ sum+=matrix[c][i]||0; });
    const segs=cats.map(function(c,ci){
      const v=matrix[c][i]||0;
      if(!v) return '';
      const h=v/max*118;
      /* 칸이 너무 얇으면 숫자가 뭉개지므로 13px 이상일 때만 안에 넣는다 */
      const label = h>=13 ? '<span>'+v+'</span>' : '';
      return '<div class="seg" style="height:'+h+'px;background:'+catColor(c,ci)+'">'+label+'</div>';
    }).join('');
    return '<div class="vcol">'+
      '<div class="tot">'+(sum||'')+'</div>'+
      '<div class="stack">'+segs+'</div>'+
      '<div class="lb">'+esc(m.slice(2).replace('-','.'))+'</div></div>';
  }).join('');
  const legend=cats.map(function(c,ci){
    return '<span><i style="background:'+catColor(c,ci)+'"></i>'+esc(catLabel(c))+'</span>'; }).join('');
  return '<div class="vbars">'+cols+'</div><div class="legend">'+legend+'</div>';
}
/* 가로 막대 — 항목 이름이 길어 읽기 편하다 */
function hBars(pairs){
  let max=1;
  pairs.forEach(function(p){ if(p.v>max) max=p.v; });
  const total=pairs.reduce(function(s,p){ return s+p.v; },0)||1;
  return pairs.map(function(p,i){
    return '<div class="hbar"><div class="top"><span>'+esc(catLabel(p.k))+'</span>'+
      '<b>'+n(p.v)+'건 · '+Math.round(p.v/total*100)+'%</b></div>'+
      '<div class="track"><div class="fill" style="width:'+(p.v/max*100)+'%;background:'+
      catColor(p.k,i)+'"></div></div></div>';
  }).join('');
}
/* 도넛 — 비중을 한눈에 */
function donut(pairs, centerLabel){
  const total=pairs.reduce(function(s,p){ return s+p.v; },0);
  if(!total) return '<div class="sub2">표시할 데이터가 없습니다.</div>';
  let acc=0;
  const stops=pairs.map(function(p,i){
    const from=acc/total*360; acc+=p.v;
    return catColor(p.k,i)+' '+from+'deg '+(acc/total*360)+'deg';
  }).join(',');
  const side=pairs.map(function(p,i){
    return '<div><i style="background:'+catColor(p.k,i)+'"></i>'+esc(catLabel(p.k))+
      '<b>'+n(p.v)+'건</b></div>'; }).join('');
  return '<div class="donut"><div class="ring" style="background:conic-gradient('+stops+')">'+
    '<div class="hole"><b>'+n(total)+'</b><span>'+esc(centerLabel||'건')+'</span></div></div>'+
    '<div class="side">'+side+'</div></div>';
}

/* ── 관리 · 대시보드 ──────────────────────────────── */
function renderDash(){
  let allCats=[];
  D.items.forEach(function(x){ if(x.cat && allCats.indexOf(x.cat)<0) allCats.push(x.cat); });
  allCats=catSort(allCats);
  const totalPairs=allCats.map(function(c){
    return { k:c, v:D.items.filter(function(x){ return x.cat===c; }).length };
  });
  const grand=D.items.length;

  /* 최근 12개월 추이 */
  const months=recentMonths(12);
  const matrix={};
  allCats.forEach(function(c){ matrix[c]=months.map(function(){ return 0; }); });
  D.items.forEach(function(x){
    const i=months.indexOf(String(x.applied).slice(0,7));
    if(i>=0 && matrix[x.cat]) matrix[x.cat][i]++;

    '<div class="notice"><div class="ttl" style="margin:0">전체 누적</div>'+
      '<span class="big">'+n(grand)+'건</span></div>'+
    '<div class="chart"><h3>월별 시딩 추이 (최근 12개월)</h3>'+
      stackedBars(months, allCats, matrix)+'</div>'+
    '<div class="chart"><h3>플랫폼별 누계</h3>'+

      '<b>'+n(grand+feeTotal)+'원</b></div>'+

      '과거 방식인 "판매 목적 라이센스" 건에는 수수료가 붙지 않습니다.</div></div>';

  setHTML('v3dash',
    '<div class="notice"><div class="ttl" style="margin:0">전체 누적</div>'+

      '<div class="sub2" style="margin-top:4px">비용 '+n(grand)+'원'+
      (feeTotal?' + 수수료 '+n(feeTotal)+'원':'')+'</div></div>'+

/* ── 관리 · 게시확인 ────────────────────────────────
   조치가 필요한 알림은 접힘 밖에 두고, 카드 목록만 접습니다. */
function renderPosted(){
  const days=(D.thresholds && D.thresholds.postCheck) || 7;

  /* ① 미업로드 — 업로드일이 비어 있는 건 (대가없음·삭제 제외) */
  const nou=D.items.filter(function(x){
    return !x.uploadDate && x.state!=='삭제' && x.state!=='대가없음'; })
    .slice().sort(function(a,b){
      if(a.dDeadline===null && b.dDeadline===null) return 0;
      if(a.dDeadline===null) return 1;
      if(b.dDeadline===null) return -1;
      return a.dDeadline-b.dDeadline;   /* 급한 것부터 */
    });

  /* ② 게시중 — 확인 후에도 목록에 남는다 */
  const post=D.items.filter(function(x){ return x.state==='게시중'; })
    .slice().sort(function(a,b){
      const ac=a.check||'', bc=b.check||'';
      if(!ac && bc) return -1;
      if(ac && !bc) return 1;
      return ac.localeCompare(bc);
    });
  const due=post.filter(function(x){
    return !x.check || dayGap(x.check, D.today) >= days; }).length;

  let h='';
  /* 조치가 필요한 것만 접힘 밖에 남깁니다 */
  if(due) h+=box('danger','확인 필요 '+due+'건',
    '확인한 지 '+days+'일이 넘었거나 아직 확인 전인 게시 건입니다.');
  if(!nou.length && !post.length) h+=box('ok','미업로드·게시중 건이 없습니다.','');

  h+= nou.length
    ? fold('미업로드', nou.length+'건',
        '<div class="inner">'+
        '<div class="sub2" style="margin-bottom:10px"><b>URL</b>을 확인하고 '+
        '<b>업로드</b> 또는 <b>미업로드</b>를 누르면 오늘 날짜가 최종확인에 기록됩니다.</div>'+
        nou.map(function(x){ return itemHtml(x,'nou'); }).join('')+'</div>', false, 'warn')
    : '';
  h+= post.length
    ? fold('게시중', post.length+'건',
        '<div class="inner">'+
        '<div class="sub2" style="margin-bottom:10px">확인 후에도 목록에 남습니다.</div>'+
        post.map(function(x){ return itemHtml(x,'pchk'); }).join('')+'</div>', false, 'ok')
    : '';

  setHTML('v2posted', h);
}

/* ── 2차활용 · 등록 ───────────────────────────────── */
/* ── 관리 · 캠페인 ────────────────────────────────
   시트 [캠페인관리] 의 값을 그대로 보여줍니다.
   서버(웹앱_시딩.gs)가 아래 형태로 보내주면 그 값을 쓰고,
   아직 보내지 않으면 진행 건에서 캠페인 이름으로 묶어 대신 만듭니다.

     campaigns : [{ state, name, cat, start, deadline, fee, quota }]
       state    A열 진행상태      진행중 · 종료
       name     B열 캠페인명
       cat      C열 플랫폼
       start    D열 시작일        yyyy-MM-dd
       deadline E열 업로드 마감일  yyyy-MM-dd
       fee      F열 원고료        숫자
       quota    G열 선정 인원     숫자
*/
function campRows(){
  if(D.campaigns && D.campaigns.length){
    return D.campaigns.map(function(c){
      return { state:c.state||'', name:c.name||'', cat:c.cat||'',
               start:String(c.start||'').slice(0,10), deadline:String(c.deadline||'').slice(0,10),
               fee:num(c.fee), quota:num(c.quota), src:'sheet' };
    }).filter(function(c){ return !!c.name; });
  }
  /* 대체 — 진행 건에서 캠페인 이름으로 묶습니다 (시트 값은 알 수 없습니다) */
  const map={};
  D.items.forEach(function(x){
    const k=x.campaign||'';
    if(!k) return;
    if(!map[k]) map[k]={ state:'', name:k, cat:x.cat||'', start:'', deadline:x.deadline||'',
                         fee:null, quota:null, src:'items', d:[] };
    map[k].d.push(String(x.applied||'').slice(0,10));
  });
  return Object.keys(map).map(function(k){
    const c=map[k], ds=c.d.filter(Boolean).sort();
    c.start = ds[0]||'';
    return c;
  });
}
/* 이번 달 말일 — 종료일을 비워 두면 여기까지 봅니다 */
function monthEnd(){
  const d=new Date(), e=new Date(d.getFullYear(), d.getMonth()+1, 0);
  const p=function(x){ return String(x).padStart(2,'0'); };
  return e.getFullYear()+'-'+p(e.getMonth()+1)+'-'+p(e.getDate());
}
function campItems(c){
  return D.items.filter(function(x){ return x.campaign===c.name; });
}

function renderCamp(){
  const from=val('cFrom'), to=(val('cTo')||monthEnd());
  const cat=val('cCat'), prod=val('cProd');

  let list=campRows();
  /* 기간은 시작일 기준입니다. 시작일을 모르는 건은 걸러내지 않습니다. */
  list=list.filter(function(c){
    if(!c.start) return true;
    if(from && c.start < from) return false;
    if(to   && c.start > to)   return false;
    return true;
  });
  if(cat)  list=list.filter(function(c){ return c.cat===cat; });
  if(prod) list=list.filter(function(c){
    return campItems(c).some(function(x){ return x.product===prod; }); });

  list.sort(function(a,b){ return String(b.start).localeCompare(String(a.start)); });

  const head = (list.length && list[0].src==='items')
    ? box('note','캠페인관리 시트가 아직 연결되지 않았습니다',
        '진행 건에서 캠페인 이름으로 묶어 보여주는 중입니다. '+
        '진행상태 · 원고료 · 선정 인원은 서버가 시트를 읽어 보내주면 채워집니다.')
    : '';

  if(!list.length){
    setHTML('campBody', head+'<div class="empty">조건에 맞는 캠페인이 없습니다.</div>');
    return;
  }
  setHTML('campBody', head+
    '<div class="sub2" style="margin-bottom:8px">'+list.length+'개 · '+
      esc(from||'처음')+' ~ '+esc(to)+' 시작</div>'+
    list.slice(0,200).map(campCard).join('')+
    (list.length>200 ? box('note','200개까지만 표시했습니다.','기간을 좁혀주세요.') : ''));
}

function campCard(c){
  const uid='cmp_'+String(c.name).replace(/[^A-Za-z0-9가-힣_-]/g,'_');
  const open=OPEN[uid]?' open':'';
  const its=campItems(c);
  const done=its.filter(function(x){ return !!x.uploadDate; }).length;
  const live=its.filter(function(x){ return x.state==='게시중'; }).length;
  const del =its.filter(function(x){ return x.state==='삭제'; }).length;

  const prods=[];
  its.forEach(function(x){ if(x.product && prods.indexOf(x.product)<0) prods.push(x.product); });

  const badge = c.state==='진행중' ? 'b-게시중' : (c.state==='종료' ? 'b-종료' : 'b-발송대기');
  const period = (c.start||'—')+' ~ '+(c.deadline||'—');

  const people = its.length
    ? its.map(function(x){
        return '<div style="font-size:12px;margin-bottom:6px">'+esc(x.name)+
          ' <span class="badge b-'+esc(x.state)+'">'+esc(x.state)+'</span>'+
          (x.url ? ' <a class="url" href="'+esc(x.url)+'" target="_blank" rel="noopener">URL</a>' : '')+
          '</div>';
      }).join('')
    : '<span class="sub2">이 캠페인으로 등록된 진행 건이 없습니다.</span>';

  return '<div class="it'+open+'" id="'+esc(uid)+'">'+
    '<div class="hd" onclick="toggleIt(\''+jsq(uid)+'\')">'+
      '<div><div class="nm">'+esc(c.name)+'</div>'+
        '<div class="meta">'+esc(catLabel(c.cat))+'<br>'+esc(period)+'</div></div>'+
      '<div class="right"><span class="badge '+badge+'">'+esc(c.state||'—')+'</span>'+
        '<div class="dd ok">'+(c.quota!==null ? n(c.quota)+'명 선정' : its.length+'건')+'</div></div>'+
    '</div>'+
    '<div class="bd"><div class="kv">'+
      '<span>플랫폼</span><b>'+esc(catLabel(c.cat))+'</b>'+
      '<span>시작일</span><b>'+esc(c.start||'—')+'</b>'+
      '<span>업로드 마감일</span><b>'+esc(c.deadline||'—')+'</b>'+
      '<span>원고료</span><b>'+(c.fee!==null ? n(c.fee)+'원' : '—')+'</b>'+
      '<span>선정 인원</span><b>'+(c.quota!==null ? n(c.quota)+'명' : '—')+'</b>'+
      '<span>진행 건</span><b>'+n(its.length)+'건</b>'+
      '<span>업로드완료</span><b>'+n(done)+'건</b>'+
      '<span>게시중</span><b>'+n(live)+'건</b>'+
      (del ? '<span>삭제</span><b class="dg">'+n(del)+'건</b>' : '')+
      '<span>상품</span><b>'+(prods.length ? esc(prods.join(' · ')) : '—')+'</b>'+
    '</div>'+
    '<div class="hr"></div><div class="lb2">참여 인플루언서</div>'+people+
    '</div></div>';
}

function renderSecReg(){
  const r=applyFilter('s');
  if(r.empty){
    setHTML('secRegBody','');
    return;
  }
  setHTML('secRegBody', listHtml(r.list,'sec'));
}

/* ── 2차활용 · 전체 ─────────────────────────────────
   앱에서 등록한 건 + 시트에 예전 방식으로 표시된 건(브랜더진 W열)을 함께 본다. */
function renderSecList(){
  let list=D.items.filter(function(x){ return x.s2type || x.legacy2; });

  const cat=val('lCat'), prod=val('lProd'), chan=val('lChan'), per=val('lPer');
  const nm=(val('lName')||'').trim().toLowerCase().replace(/^@/,'');

  if(cat)  list=list.filter(function(x){ return x.cat===cat; });
  if(prod) list=list.filter(function(x){ return x.product===prod; });
  if(chan) list=list.filter(function(x){ return x.s2type===chan; });
  if(per)  list=list.filter(function(x){ return (x.s2period||(x.s2forever?'영구':''))===per; });
  if(nm)   list=list.filter(function(x){
    return (x.name+' '+(x.handleShown||x.handle||'')).toLowerCase()
      .replace(/@/g,'').indexOf(nm)>=0; });

  list=list.slice().sort(function(a,b){
    const av=a.s2type?0:1, bv=b.s2type?0:1;
    if(av!==bv) return av-bv;
    if(a.s2forever&&b.s2forever) return 0;
    if(a.s2forever) return 1;
    if(b.s2forever) return -1;
    return String(a.s2e).localeCompare(String(b.s2e));
  });

  if(!list.length){
    setHTML('secListBody','<div class="empty">조건에 맞는 2차 활용 건이 없습니다.</div>');
    return;
  }

  const legacy=list.filter(function(x){ return !x.s2type; });
  const soon=list.filter(function(x){ return x.flags.indexOf('secondEnd')>=0; }).length;

  /* 조치가 필요한 알림은 접힘 밖, 목록은 접이식 */
  setHTML('secListBody',
    (soon ? box('danger','종료 임박 '+soon+'건',
       '만료 전에 연장 협의 또는 소재 내리기를 확인하세요.') : '')+
    (legacy.length ? box('note','기간이 등록되지 않은 '+legacy.length+'건',
       '금액만 있고 기간이 없습니다. 항목을 눌러 [2차 활용 등록]에서 채널·기간을 채워주세요.') : '')+
    fold('2차 활용 건', list.length+'건',
      '<div class="inner">'+list.map(function(x){ return itemHtml(x,'seclist'); }).join('')+'</div>',
      false, 'd3'));
}

/* ── 공통 목록 ────────────────────────────────────── */
function listHtml(list, ctx){
  if(!list.length) return '<div class="empty">조건에 맞는 건이 없습니다.</div>';
  return '<div class="sub2" style="margin-bottom:8px">'+list.length+'건</div>'+
    list.slice(0,300).map(function(x){ return itemHtml(x,ctx); }).join('')+
    (list.length>300 ? box('note','300건까지만 표시했습니다.','검색으로 좁혀주세요.') : '');
}

/* 게시중이면 D-N, 끝났으면 종료, 그 외에는 상태 글자 그대로 */
function tagText(x){
  if(x.state==='게시중') return (x.dPost===null) ? '게시중' : ('D-'+x.dPost);
  return x.state;
}

/* ── 항목 카드 ────────────────────────────────────── */
function itemHtml(x, ctx){
  const uid = ctx+'_'+String(x.id).replace(/[^A-Za-z0-9가-힣_-]/g,'_');
  const open = OPEN[uid] ? ' open' : '';
  let note='';
  if(!x.uploadDate && x.dDeadline!==null && x.state!=='대가없음'){
    note = x.dDeadline<0 ? '<div class="dd over">마감 '+(-x.dDeadline)+'일 초과</div>'
         : '<div class="dd soon">마감까지 '+x.dDeadline+'일</div>';
  }else if(x.state==='삭제' && x.delchk){
    note = '<div class="dd over">'+esc(x.delchk)+' 확인</div>';
  }
  /* 관리·게시확인에서 확인 주기가 지난 건을 눈에 띄게 */
  if(ctx==='pchk'){
    const days=(D.thresholds && D.thresholds.postCheck) || 7;
    const over = !x.check || dayGap(x.check, D.today) >= days;
    note = (over ? '<div class="dd over">확인 필요</div>' : '')+
      '<div class="dd ok">최종확인 '+esc(x.check||'없음')+'</div>';
  }

  return '<div class="it'+open+'" id="'+esc(uid)+'">'+
    '<div class="hd" onclick="toggleIt(\''+jsq(uid)+'\')">'+
      '<div><div class="nm">'+esc(x.name)+'</div>'+
        '<div class="meta">'+esc(catLabel(x.cat))+(x.campaign?' · '+esc(x.campaign):'')+'<br>'+
        esc(x.product||'—')+'</div></div>'+
      '<div class="right"><span class="badge b-'+esc(x.state)+'">'+esc(tagText(x))+'</span>'+
        (x.isRental ? '<div class="dd rent">대여</div>' : '')+note+'</div>'+
    '</div>'+
    quickHtml(x, uid, ctx)+
    '<div class="bd">'+detailHtml(x, uid, ctx)+'</div></div>';
}

function toggleIt(uid){
  const el=$(uid);
  if(!el) return;
  const now = el.className.indexOf('open')===-1;
  el.className = now ? 'it open' : 'it';
  OPEN[uid]=now;
}

/* ── 카드에 바로 붙는 버튼 ──────────────────────────
   펼치지 않고 한 번에 처리할 수 있게 하기 위한 것.
   onclick 안에 들어가는 값은 전부 jsq 로 감싼다 — 이름이나 URL 에
   작은따옴표가 들어가면 버튼이 통째로 죽기 때문이다. */
function openBtn(url, label){
  if(!url) return '';
  return '<button onclick="event.stopPropagation();window.open(\''+jsq(url)+'\',\'_blank\')">'+
    esc(label)+'</button>';
}
function quickHtml(x, uid, ctx){
  if(!can('write')) return '';
  const acct = openBtn(x.acctUrl, '계정');
  const anyUrl = openBtn(x.url || x.acctUrl, 'URL');
  const id = jsq(x.id), u = jsq(uid);
  let b='';

  if(ctx==='upc'){
    b = acct +
      '<button class="pri" onclick="event.stopPropagation();doUpload(\''+id+'\',\''+u+'\')">완료</button>'+
      '<button class="no" onclick="event.stopPropagation();doUpchk(\''+id+'\',\''+u+'\')">미완료</button>';
  }else if(ctx==='pst'){
    b = (x.url ? openBtn(x.url,'글 열기') : acct) +
      '<button class="pri" onclick="event.stopPropagation();doCheck(\''+id+'\',\''+u+'\')">확인</button>'+
      '<button class="no" onclick="event.stopPropagation();doDel(\''+id+'\',\''+u+'\')">미확인</button>';
  }else if(ctx==='nou'){
    /* 계정을 열어 올라왔는지 확인한 뒤 둘 중 하나를 누른다.
       어느 쪽이든 최종확인에 오늘 날짜가 기록된다. */
    b = (anyUrl || acct) +
      '<button class="no" onclick="event.stopPropagation();doRecheck(\''+id+'\',\''+u+'\')">미업로드</button>'+
      '<button class="pri" onclick="event.stopPropagation();doUpload(\''+id+'\',\''+u+'\')">업로드</button>';
  }else if(ctx==='pchk'){
    b = (anyUrl || acct) +
      '<button class="no" onclick="event.stopPropagation();doDel(\''+id+'\',\''+u+'\')">삭제</button>'+
      '<button class="pri" onclick="event.stopPropagation();doCheck(\''+id+'\',\''+u+'\')">게시중</button>';
  }else if(ctx==='del'){
    /* 게시기간 중 삭제 — 미처리는 확인만, 처리완료는 업로드완료로 복구 */
    b = (anyUrl || acct) +
      '<button class="no" onclick="event.stopPropagation();doRecheck(\''+id+'\',\''+u+'\')">미처리</button>'+
      '<button class="pri" onclick="event.stopPropagation();doRestore(\''+id+'\',\''+u+'\')">처리완료</button>';
  }else{
    return '';   /* delok · all · sec 등은 조치할 것이 없어 버튼을 두지 않는다 */
  }

  return '<div class="qa">'+b+'</div><div class="qmsg" id="q_'+esc(uid)+'"></div>';
}

function detailHtml(x, uid, ctx){
  /* 게시기간 — 업로드 전이면 "—", 업로드했으면 "업로드일 ~ 종료일" */
  const period = x.uploadDate ? esc(x.uploadDate)+' ~ '+esc(x.postPeriod||'—') : '—';

  const acct = x.acctUrl
    ? '<a href="'+esc(x.acctUrl)+'" target="_blank" rel="noopener">'+
        esc(x.handleShown||x.handle||'열기')+'</a>'
    : esc(x.handleShown||x.handle||'—');

  /* 2차 활용 — O/X 로 접어두고 눌러야 펼쳐지게 */
  const has = !!(x.s2type || x.legacy2);
  const second = has
    ? 'O <span class="more" onclick="toggleBox(\'s2_'+jsq(uid)+'\')">상세보기</span>'
    : 'X';

  let h='<div class="kv">'+
    (x.orderNo
      ? '<span>주문번호</span><b>'+esc(x.orderNo)+'</b>'
      : '<span>계정</span><b>'+acct+'</b>')+
    '<span>캠페인 · 업로드마감</span><b>'+esc(x.campaign||'—')+' · '+esc(x.deadline||'—')+'</b>'+
    '<span>게시기간</span><b>'+period+'</b>'+
    (x.way && x.way!=='시딩' ? '<span>진행방식</span><b>'+esc(x.way)+'</b>' : '')+
    (x.coop ? '<span>협업유형</span><b>'+esc(x.coop)+'</b>' : '')+
    '<span>2차 활용</span><b>'+second+'</b>'+
    (x.url ? '<span>콘텐츠</span><b><a href="'+esc(x.url)+
      '" target="_blank" rel="noopener">URL</a></b>' : '')+
    '<span>최종확인</span><b>'+esc(x.check||'미확인')+'</b>'+
    '</div>';

  if(has){
    h+='<div class="box2" id="s2_'+esc(uid)+'" style="display:none">'+
       '<div class="kv" style="padding-top:0">'+
         '<span>사용권 구매일</span><b>'+esc(x.s2s||'—')+'</b>'+
         '<span>활용 기간</span><b>'+esc(x.s2period|| (x.s2forever?'영구':'—'))+'</b>'+
         '<span>활용 마감일</span><b>'+(x.s2forever?'영구':esc(x.s2e||'—'))+'</b>'+
         '<span>활용 채널</span><b>'+esc(x.s2type||'미등록')+'</b>'+
         '<span>2차활용 비용</span><b>'+(x.amount?n(x.amount)+'원':'—')+
           (x.brandFee?' <span class="sub2">(+수수료 '+n(x.brandFee)+'원)</span>':'')+'</b>'+
         '<span>비고</span><b>'+esc(x.s2memo||'—')+'</b>'+
       '</div></div>';
  }

  if(!can('write')) return h;

  /* 할일 탭에서는 콘텐츠 URL을 나중에 채울 수 있게 남겨둔다.
     관리·전체에서는 조회만 하도록 폼을 두지 않는다. */
  if(ctx==='upc' || ctx==='pst' || ctx==='nou' || ctx==='pchk'){
    return h+'<div class="hr"></div><div class="acts">'+
      '<input class="f" type="url" id="cu_'+esc(uid)+'" placeholder="콘텐츠 URL 등록" '+
        'inputmode="url" value="'+esc(x.url)+'">'+
      '<button class="f ghost" onclick="doUrl(\''+jsq(x.id)+'\',\''+jsq(uid)+'\')">URL 저장</button>'+
      '<div class="msg" id="m_'+esc(uid)+'"></div></div>';
  }

  /* 인플루언서 검색 결과 — 카드 안에서 사람 단위 비고를 바로 고칩니다 */
  if(ctx==='influ'){
    return h + memoHtml(x, uid);
  }

  if(ctx==='sec' || ctx==='seclist'){
    h+='<div class="hr"></div><div class="acts">'+
       '<button class="f ghost" onclick="toggleBox(\'ed_'+jsq(uid)+'\')">'+
         (has?'2차 활용 수정':'2차 활용 등록')+'</button>'+
       '<div id="ed_'+esc(uid)+'" style="display:none">'+secondFormHtml(x, uid)+'</div>'+
       '<div class="msg" id="m_'+esc(uid)+'"></div></div>';
  }
  return h;
}

  const periods=(D.secondPeriods||[]).map(function(p){
    return '<option value="'+esc(p.v)+'"'+(x.s2period===p.t?' selected':'')+'>'+esc(p.t)+'</option>'; }).join('');
  const cost = x.s2cost ? x.s2cost : (x.amount||'');

  /* 날짜칸과 선택칸을 한 줄에 둘씩 넣으면 모바일에서 겹쳐 보이므로
     각 항목을 한 줄씩 배치하고, 입력칸 높이를 .fld 로 통일한다. */
